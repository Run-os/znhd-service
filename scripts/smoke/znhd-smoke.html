<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>znhd 冒烟测试</title>

    <!-- ===== 模拟真实宿主页面的「敌意 CSS」=====
         本脚本的面板/弹窗是注入到**别人页面**里的：税务页有全局 text-align:center、
         非 border-box 盒模型、自定义 svg 对齐等规则，会污染 antd 组件外观
         （v26.10.06-v11 的「弹窗文字全居中 + 输入框图标偏移」就是这么来的）。
         这里常驻几条同类规则，作为样式隔离层（lib/ui/uiReset.ts + 弹窗 styles.body）的回归守卫。 -->
    <style>
      html,
      body {
        text-align: center; /* 旧代码靠显式 textAlign:'left' 守，去掉就会整屏居中 */
      }
      body * {
        box-sizing: content-box; /* 非 border-box，验证隔离层是否复位 */
      }
      /* 实测抓到的真凶：某第三方样式给 svg 加了负上边距（用户环境里时钟图标的
         margin: -2.75em auto 0 ≈ -44px），把 antd 图标整体顶出输入框。
         常驻这条规则，「时间图标与输入框同一水平线」断言才有牙齿。 */
      svg {
        margin: -2.75em auto 0;
      }
      /* ★ v26.10.08-v7：税务页 body 上带 transform 会形成独立层叠上下文，把 position:fixed 的浮层
         **困在 body 的盒子里**（本仓库 panelHost.tsx 有结论）。这里常驻这条规则，守卫两类事情：
           ① 我们的面板/弹窗挂 documentElement ⇒ 不受影响；
           ② antd Image 预览默认挂 body ⇒ 必须显式 getContainer 改挂 documentElement，否则工具栏会被推出视口、
             表现为「放大后图片盖住了下方的操作栏」（真实用户反馈的就是这个）。
         实测（1280×800、页面滚到 y=600）：不修时预览根 y=-579/h=3000、工具栏 y=2330（视口外）。 */
      body {
        transform: translateZ(0);
      }
    </style>

    <!-- ===== GM API 桩（模拟油猴环境 + 按真实中继协议返回数据） ===== -->
    <script>
      // 先落一份干净的配置（脚本读 localStorage，不读 GM_getValue）
      localStorage.removeItem('scriptCat_PhrasesCache');
      localStorage.removeItem('scriptCat_PanelPoint');
      // v26.10.12-v1：传输助手有**独立**的设置存储（与主设置隔离，见 lib/transfer/settings.ts）。
      // 这里显式清掉它，确保走「无存量 → 用默认中继地址」这条路径（否则复用上次运行的值会时好时坏）。
      localStorage.removeItem('scriptCat_TransferSettings');
      // v26.10.10-v17：故意预置**旧默认**常用语数据源地址，验证 loadAllvalue 会把它迁到新默认
      // （存量用户只要改过任何设置，当时的默认值就会被整份 Allvalue 一起落盘，光改 DEFAULTS 顶不掉）。
      localStorage.setItem(
        'scriptCat_Allvalue',
        JSON.stringify({
          voiceEnabled: false,
          useCdn: true,
          commonPhrasesUrl:
            'https://raw.githubusercontent.com/Run-os/znhd-service/refs/heads/main/public/commonPhrases.yaml',
        })
      );

      window.__gmXhrLog = [];
      // v26.10.14-v3：表情包数据层改「中继优先、CDN 兜底」后的请求计数
      // （relayManifest/relayImage 走中继，cdn = 兜底被触发；断言「零 CDN」用）
      window.__emojiReq = { relayManifest: 0, relayImage: 0, cdn: 0 };
      const PNG_1x1 =
        'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==';
      // 收到图片的载荷：用 canvas 生成一张**真实尺寸**的 JPEG（480×360），而不是 1×1 占位 PNG。
      // 原因：断言里要校验「放大后主图有可见尺寸」（rect > 10px），而 1×1 的图 Viewer 只会渲染成 1px，
      // 该判定形同虚设（v26.10.8-v1 加断言时踩过：canvasImg/decoded 都 true，只有 visible 因 1px 为 false）。
      const SMOKE_IMG_B64 = (() => {
        try {
          const c = document.createElement('canvas');
          c.width = 480;
          c.height = 360;
          const ctx = c.getContext('2d');
          ctx.fillStyle = '#e6f2ff';
          ctx.fillRect(0, 0, 480, 360);
          for (let i = 0; i < 40; i++) {
            ctx.fillStyle = 'hsl(' + ((i * 37) % 360) + ',70%,55%)';
            ctx.fillRect((i * 53) % 420, (i * 97) % 300, 60, 50);
          }
          return c.toDataURL('image/jpeg', 0.8).split(',')[1];
        } catch (e) {
          return PNG_1x1; // canvas 不可用时退回占位图（可见尺寸断言会因此失败，属预期）
        }
      })();
      const PHRASES_YAML = ['冒烟常用语A: |', '  A 的内容', '冒烟常用语B: |', '  B 的内容', ''].join('\n');
      /** 在线表情包合集名（v26.10.13-v3）：对应 cdn.klyang.com/json/<id>.json 的 name 字段 */
      const EMOJI_PACK_NAMES = { aluhedwm: '阿鲁和动物们', alurc: '阿鲁日常' };
      // 更新日志：给 12 条，验证「默认只显示最新 10 条」+ 条数提示（多出的 2 条不渲染）
      const CHANGELOG_MD = (() => {
        const parts = ['# 更新日志', '', '本文件是唯一来源。', '', '---', ''];
        for (let i = 1; i <= 12; i++) {
          parts.push('### znhd.user.js v99.0.' + i + '-v1');
          parts.push('');
          parts.push(i === 1 ? '- 冒烟更新日志标记行' : '- 第 ' + i + ' 条日志内容');
          parts.push('');
        }
        return parts.join('\n');
      })();

      // 剪贴板写入桩：只**记录**每次 clipboard.write 的条目类型并直接拒绝。
      // 这样无需真实剪贴板权限即可断言「代码有没有先拿不支持的 jpeg 去试」——
      // headless 里图片剪贴板根本写不进去（实测即使只写一次 image/png 也会被拒），
      // 所以断言只能锁「尝试的类型」这个不变量，不能锁「写成功」。
      window.__copyWriteTypes = [];
      try {
        if (typeof Clipboard !== 'undefined' && Clipboard.prototype && Clipboard.prototype.write) {
          Clipboard.prototype.write = function (items) {
            window.__copyWriteTypes.push(Array.prototype.map.call(items, (i) => i.types));
            return Promise.reject(new DOMException('smoke-stub: 桩环境不支持写剪贴板', 'NotAllowedError'));
          };
        }
      } catch (e) {
        /* 忽略：环境没有 Clipboard 时断言会因「零次调用」而失败，属预期 */
      }

      // 打印（v26.10.08-v1 起）：react-to-print 会往 body 挂一个 id=printWindow 的隐藏 iframe。
      // ⚠️ headless 里没有打印对话框，且桌面 UA 下打印完成后 iframe 会被立刻移除，
      //    所以不能用「iframe 还在不在」判断，必须用 MutationObserver 在**插入那一刻**记录。
      // 该 iframe 只在「找到了打印内容节点」时才会被挂上（react-to-print 拿不到内容会直接 return），
      // 因此它出现 = 「按钮 → printImage → doPrint」整条链路真的接通了。
      // v26.10.08-v4 起再往里看一眼**打印文档本身**：A4 版式（@page size:A4 + 图片框毫米尺寸 + object-fit）
      // 必须真的注入到 iframe 里，而不是只写在源码里。
      // 时序说明：react-to-print 是先给 iframe 赋 onload、再 appendChild；我们的监听注册在其后，
      // 所以本回调触发时它已经把内容克隆进 body、并把 pageStyle 追加进 head 了。
      window.__printIframeSeen = false;
      window.__printDoc = null;
      try {
        new MutationObserver((muts) => {
          muts.forEach((m) =>
            Array.prototype.forEach.call(m.addedNodes, (n) => {
              if (n && n.id === 'printWindow') {
                window.__printIframeSeen = true;
                n.addEventListener('load', () => {
                  try {
                    const doc = n.contentDocument;
                    const img = doc && doc.querySelector('img');
                    const box = doc && doc.querySelector('body > div');
                    const styles = doc
                      ? Array.from(doc.querySelectorAll('style')).map((s) => s.textContent || '')
                      : [];
                    window.__printDoc = {
                      hasImg: !!img,
                      pageA4: styles.some((t) => /@page/.test(t) && /size:\s*A4/i.test(t)),
                      // 页眉页脚（v26.10.08-v5）：浏览器把标题/URL/日期/页码画在**页边距**里，
                      // 故 `@page` 的 margin 必须为 0 —— 没边距它们就没地方画（CSS 无法直接取消那个勾选项）。
                      pageMarginZero: styles.some((t) => /@page\s*\{[^}]*margin:\s*0\s*[;}]/.test(t)),
                      boxStyle: box ? box.getAttribute('style') : null,
                      imgStyle: img ? img.getAttribute('style') : null,
                    };
                  } catch (e) {
                    window.__printDoc = { error: String((e && e.message) || e) };
                  }
                });
              }
            })
          );
        }).observe(document.documentElement, { childList: true, subtree: true });
      } catch (e) {
        /* 忽略：不支持 MutationObserver 时断言会因「从未见到 iframe」而失败，属预期 */
      }

      // extra 用来覆盖默认字段（status/responseHeaders/response），图片嗅探夹具要用到
      const reply = (details, payload, extra) => {
        setTimeout(() => {
          if (typeof details.onload === 'function') {
            details.onload({
              status: 200,
              statusText: 'OK',
              responseText: typeof payload === 'string' ? payload : JSON.stringify(payload),
              responseHeaders: '',
              finalUrl: details.url,
              ...(extra || {}),
            });
          }
        }, 40);
      };

      window.GM_info = {
        // 由 run.js 从构建产物的 ==UserScript== 头读出真实 @version 注入（evaluateOnNewDocument），
        // 这样「面板渲染的版本号」才是对产物的真实校验，而不是桩里的死值
        script: { version: window.__scriptVersion || '0.0.0-v0' },
        scriptHandler: 'smoke-harness',
        scriptUpdateURL: 'https://example.invalid/znhd.user.js',
        scriptWillUpdate: false,
      };
      window.unsafeWindow = window;
      window.GM_getValue = (k, d) => (k in (window.__store || {}) ? window.__store[k] : d);
      window.GM_setValue = (k, v) => {
        window.__store = window.__store || {};
        window.__store[k] = v;
      };
      window.GM_addStyle = (css) => {
        const s = document.createElement('style');
        s.textContent = css;
        document.head.appendChild(s);
        return s;
      };
      window.GM_setClipboard = () => {};
      window.GM_getResourceText = () => '';
      window.GM_notification = () => {};
      window.GM_addValueChangeListener = () => {};

      // 表情图桩图（v26.10.14-v3 起中继 /emoji/ 与 CDN 兜底两条路共用同一张）：
      // 必须返回**真 webp Blob** —— 代码用 responseType:'blob' 取图，并把 blob.type 当 mime
      // 一路传给发送链路（压缩层据此判「webp 原样直传」、手机端据此定文件名后缀），
      // 用 PNG 糊弄会让这些断言全都测不到真东西。
      const replyEmojiWebp = (details) => {
        const cv = document.createElement('canvas');
        cv.width = 32;
        cv.height = 32;
        const ctx = cv.getContext('2d');
        ctx.clearRect(0, 0, 32, 32); // 透明背景：与真实表情图一致
        ctx.fillStyle = '#07C160';
        ctx.fillRect(4, 4, 24, 24);
        cv.toBlob((b) => {
          setTimeout(() => {
            if (typeof details.onload === 'function') {
              details.onload({
                status: 200,
                statusText: 'OK',
                response: b,
                responseText: '',
                responseHeaders: 'content-type: image/webp',
                finalUrl: details.url,
              });
            }
          }, 30);
        }, 'image/webp');
      };

      window.GM_xmlhttpRequest = (details) => {
        const url = String((details && details.url) || '');
        window.__gmXhrLog.push(((details && details.method) || 'GET') + ' ' + url);

        // ===== 两台在线手机的 ID（v26.10.13-v6：/recv 桩按发送者归组要用）=====
        // 与下面 /phone/status 桩、sessionRouteBySenderOk 断言共用同一组值；
        // 两个 ID 前 8 位不同，才能验证「按短 ID 区分展示」不会把两台显示成同一个。
        const _SMOKE_PHONE_A = '11111111-1111-4111-8111-111111111111';
        const _SMOKE_PHONE_B = '22222222-2222-4222-8222-222222222222';

        // 常用语 YAML：走成功路径
        if (url.includes('commonPhrases.yaml')) {
          reply(details, PHRASES_YAML);
          return { abort: () => {} };
        }
        // 更新日志 changelogs/YYYY-MM.md（当月文件）：走成功路径
        if (url.includes('changelogs/')) {
          reply(details, CHANGELOG_MD);
          return { abort: () => {} };
        }
        // 「发送测试图片」（v26.10.08-v10）随机图源：返回一张**真 Blob**（我们的代码用 responseType:'blob'）
        if (url.indexOf('t.alcy.cc') >= 0) {
          const cv = document.createElement('canvas');
          cv.width = 200;
          cv.height = 150;
          const ctx = cv.getContext('2d');
          ctx.fillStyle = '#7c3aed';
          ctx.fillRect(0, 0, 200, 150);
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 24px sans-serif';
          ctx.fillText('TEST', 62, 88);
          cv.toBlob((b) => {
            setTimeout(() => {
              if (typeof details.onload === 'function') {
                details.onload({
                  status: 200,
                  statusText: 'OK',
                  response: b,
                  responseText: '',
                  responseHeaders: 'content-type: image/png',
                  finalUrl: url,
                });
              }
            }, 40);
          }, 'image/png');
          return { abort: () => {} };
        }
        // ===== 中继表情包服务（v26.10.14-v3：数据层改为「中继优先、CDN 兜底」）==========
        // 脚本端先打 <中继地址>/emoji/packs.json（合并清单，条目带 path + src），图片再打
        // <中继地址>/emoji/<合集>/<文件>；只有中继整体失败才回退下面的 cdn.klyang.com 分支。
        // 桩按同一优先级作答并分别计数 —— 「兜底零触发」才是中继优先真的生效的直接证据。
        // 中继地址取自传输助手设置（fixture 清掉了设置 ⇒ 默认 https://znhd.122050.xyz），
        // 故这里按 URL 路径后缀匹配，不写死主机名。
        if (url.indexOf('/emoji/packs.json') >= 0) {
          window.__emojiReq.relayManifest++;
          reply(details, {
            version: 1,
            ts: Date.now(),
            // 形态与 relay-server/emoji-store.js 的 normalizePack 产出一致
            // （path = 中继图片路径，src = CDN 原址，客户端中继失败时按 src 兜底）
            packs: [
              {
                id: 'aluhedwm',
                name: EMOJI_PACK_NAMES.aluhedwm,
                items: [
                  {
                    key: '01',
                    name: 'aluhedwm-01.webp',
                    path: '/emoji/aluhedwm/aluhedwm-01.webp',
                    src: 'https://cdn.klyang.com/emo/smoke/aluhedwm/01.webp',
                  },
                  {
                    key: '02',
                    name: 'aluhedwm-02.webp',
                    path: '/emoji/aluhedwm/aluhedwm-02.webp',
                    src: 'https://cdn.klyang.com/emo/smoke/aluhedwm/02.webp',
                  },
                ],
              },
              {
                id: 'alurc',
                name: EMOJI_PACK_NAMES.alurc,
                items: [
                  {
                    key: '01',
                    name: 'alurc-01.webp',
                    path: '/emoji/alurc/alurc-01.webp',
                    src: 'https://cdn.klyang.com/emo/smoke/alurc/01.webp',
                  },
                  {
                    key: '02',
                    name: 'alurc-02.webp',
                    path: '/emoji/alurc/alurc-02.webp',
                    src: 'https://cdn.klyang.com/emo/smoke/alurc/02.webp',
                  },
                ],
              },
            ],
          });
          return { abort: () => {} };
        }
        // 中继图片本体（relay-store 服务形态；真实中继缺失时会按需补图，桩直接给图）
        if (/\/emoji\/[a-zA-Z0-9_-]{1,40}\/[A-Za-z0-9._-]{1,80}$/.test(url)) {
          window.__emojiReq.relayImage++;
          replyEmojiWebp(details);
          return { abort: () => {} };
        }
        // ===== 在线表情包（v26.10.13-v3）：CDN 兜底路径（v26.10.14-v3 起正常不该被走到）====
        // 为什么要桩：表情面板的数据源是公网 CDN，CI / 断网机器拿不到。冒烟只验「拿到数据之后
        // 的 UI 与接入对不对」，真实 CDN 链路由真机验证覆盖。
        if (url.indexOf('cdn.klyang.com/json/') >= 0) {
          window.__emojiReq.cdn++;
          const id = (url.split('/').pop() || '').replace('.json', '');
          reply(details, {
            name: EMOJI_PACK_NAMES[id] || id,
            type: 'image',
            items: [
              { key: '01', val: 'https://cdn.klyang.com/emo/smoke/' + id + '/01.webp' },
              { key: '02', val: 'https://cdn.klyang.com/emo/smoke/' + id + '/02.webp' },
            ],
          });
          return { abort: () => {} };
        }
        // 表情图本体（CDN 兜底）：与中继路径共用同一张桩图
        if (url.indexOf('cdn.klyang.com/emo/') >= 0) {
          window.__emojiReq.cdn++;
          replyEmojiWebp(details);
          return { abort: () => {} };
        }
        // 「发送测试图片」投递：POST /u/<deviceId>（手机上传同一条路径）→ 记录载荷供断言
        if (/\/u\/[a-z0-9-]{8,64}$/i.test(url) && String(details.method || '').toUpperCase() === 'POST') {
          try {
            window.__testImageSent = JSON.parse(details.data || '{}');
          } catch (e) {
            window.__testImageSent = { parseErr: String((e && e.message) || e) };
          }
          reply(details, { ok: true });
          return { abort: () => {} };
        }
        // 手机在线状态：模拟**两台**手机在线（v26.10.06-v4：多手机 + 定向投递相关断言）。
        // 两个 ID 前 8 位不同，才能验证「按短 ID 区分展示」不会把两台显示成同一个。
        if (/\/phone\/status\//.test(url)) {
          reply(details, {
            online: true,
            phones: [
              { id: _SMOKE_PHONE_A, lastSeen: Date.now() },
              { id: _SMOKE_PHONE_B, lastSeen: Date.now() },
            ],
          });
          return { abort: () => {} };
        }
        // 发送到手机：记录实际 POST 的载荷，用于校验「先压缩再发」（v26.10.06-v6 回归断言）
        // v26.10.12-v1：发送入口从「设备互联」抽屉搬到传输助手的设备会话聊天区，走同一条 /phone/send。
        if (/\/phone\/send\//.test(url)) {
          try {
            window.__phoneSent = window.__phoneSent || [];
            window.__phoneSent.push(JSON.parse((details && details.data) || '{}'));
          } catch (e) {
            window.__phoneSendErr = String((e && e.message) || e);
          }
          reply(details, { ok: true });
          return { abort: () => {} };
        }
        // 中继收件长轮询：先空响应确认连接，再给一条文本、一张图片，之后空转。
        // v26.10.13-v6：文本/图片都带 `from` = 手机 A —— 两台在线时内容按发送者归组，
        // 进各自手机的会话，不再全挤进聚合会话「手机」（用户报的 bug 的回归断言）。
        // 第 4 次起且 __routePhase 已置位：补发一条**来自手机 B** 的文本（只发一次），
        // 供 sessionRouteBySenderOk 断言「B 的内容进 B 的会话、且不在当前会话里」。
        if (/\/recv\//.test(url)) {
          const n = (window.__recvCount = (window.__recvCount || 0) + 1);
          if (n === 1) reply(details, { empty: true });
          else if (n === 2)
            reply(details, { type: 'text', text: '冒烟测试文本：收到一条文本消息', ts: Date.now(), from: _SMOKE_PHONE_A });
          else if (n === 3)
            reply(details, {
              type: 'image',
              name: 'smoke.jpg',
              mime: 'image/jpeg',
              data: SMOKE_IMG_B64,
              ts: Date.now(),
              from: _SMOKE_PHONE_A,
            });
          else if (n >= 4 && window.__routePhase && !window.__routeTextSent) {
            window.__routeTextSent = true;
            reply(details, {
              type: 'text',
              text: '归组测试：来自第二台手机的文本',
              ts: Date.now(),
              from: _SMOKE_PHONE_B,
            });
          } else reply(details, { empty: true });
          return { abort: () => {} };
        }
        // ===== 图片嗅探夹具（v26.10.10-v4）：按 URL 分支作答，覆盖测量阶梯 =====
        // ③ HEAD 给 content-length（走「HEAD 响应头」阶梯 → 30720 B = 30 KB）
        if (url.indexOf('/sniff-head.png') >= 0) {
          reply(details, '', { responseHeaders: 'content-type: image/png\ncontent-length: 30720' });
          return { abort: () => {} };
        }
        // ④ HEAD 故意不给 content-length（逼出 Range 阶梯）→ Range GET 回 40960 B 的 Blob = 40 KB
        if (url.indexOf('/sniff-range.png') >= 0) {
          if (String(details.method || 'GET').toUpperCase() === 'HEAD') {
            reply(details, '', { responseHeaders: 'content-type: image/png' });
            return { abort: () => {} };
          }
          reply(details, '', {
            response: new Blob([new Uint8Array(40960)], { type: 'image/png' }),
            responseText: '',
            responseHeaders: 'content-type: image/png',
          });
          return { abort: () => {} };
        }
        // ⑨ .svg 文件（v26.10.10-v7）：后缀命中排除规则 ⇒ 连请求都不会发（桩留着是为了反向验证时看得出来）
        if (url.indexOf('/media/icon.svg') >= 0) {
          reply(details, '', { responseHeaders: 'content-type: image/svg+xml\ncontent-length: 30720' });
          return { abort: () => {} };
        }
        // ⑦ 10 KB 的普通 http 图（名字不命中排除规则）→ 低于阈值：不显示卡片、不计数、不进全选范围（v26.10.10-v6）
        if (url.indexOf('/sniff-small.png') >= 0) {
          reply(details, '', { responseHeaders: 'content-type: image/png\ncontent-length: 10240' });
          return { abort: () => {} };
        }
        // ⑥ HEAD 404：尺寸测不到，但仍是图片 URL ⇒ 必须留在「大小未知」组（不丢）
        if (url.indexOf('/sniff-missing.png') >= 0) {
          reply(details, '', { status: 404, statusText: 'Not Found' });
          return { abort: () => {} };
        }
        // ⑩⑪ 会话分组夹具（v26.10.13-v8）：两张图属于两个会话，HEAD 给不同体积（50 / 60 KB）
        if (url.indexOf('/im-cos/11/sniff-conv-a.png') >= 0) {
          reply(details, '', { responseHeaders: 'content-type: image/png\ncontent-length: 51200' });
          return { abort: () => {} };
        }
        if (url.indexOf('/im-cos/11/sniff-conv-b.png') >= 0) {
          reply(details, '', { responseHeaders: 'content-type: image/png\ncontent-length: 61440' });
          return { abort: () => {} };
        }
        // ⑫ perf 优先夹具（v26.10.14-v2）：同源图 /sniff-perf.png 真加载、真进资源表（22528 B）。
        // 尺寸测量若正确走「资源表读数」档，**根本不会请求到这里**；桩故意给一个对不上的
        // content-length（123456789 → 会显示 117.74 MB），万一身寸逻辑回退到 HEAD 也会被断言抓到。
        if (url.indexOf('/sniff-perf.png') >= 0) {
          reply(details, '', { responseHeaders: 'content-type: image/png\ncontent-length: 123456789' });
          return { abort: () => {} };
        }
        // 其它一律失败，观察脚本是否优雅降级
        setTimeout(() => {
          if (details && typeof details.onerror === 'function') {
            details.onerror({ status: 0, statusText: 'smoke-harness-blocked' });
          }
        }, 40);
        return { abort: () => {} };
      };
    </script>

      // 保留 shadow 遍历只为稳妥（第三方库若再引入 shadow 也不会漏读）。
      const collectShadowText = () => {
        let text = '';
        const walk = (root) => {
          root.querySelectorAll('*').forEach((el) => {
            if (el.shadowRoot) {
              text += '\n' + (el.shadowRoot.textContent || '');
              walk(el.shadowRoot);
            }
          });
        };
        walk(document);
        return text;
      };
      // 全页文本：Shadow DOM + documentElement（弹窗挂在 documentElement 下）
      const collectText = () =>
        (document.documentElement.innerText || '') +
        '\n' +
        (document.documentElement.textContent || '') +
        '\n' +
        collectShadowText();

      // 自动打开「常用语」抽屉，验证远程 YAML 成功路径
      // ⚠️ 用「包含」而非精确相等：面板按钮是「图标 span + 文案 span」两段结构，

        const walk = (root) => {

      //   ⑤ 内联 SVG 补 600 个 circle（序列化后约 35KB），否则不够阈值、不会出现在列表里。
      (function () {
        let seed = 123456789;
        const rnd = () => ((seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648);
        const cv = document.createElement('canvas');
        cv.width = 160;
        cv.height = 160;
        const ctx = cv.getContext('2d');
        const px = ctx.createImageData(160, 160);
        for (let i = 0; i < px.data.length; i += 4) {
          px.data[i] = Math.floor(rnd() * 256);
          px.data[i + 1] = Math.floor(rnd() * 256);
          px.data[i + 2] = Math.floor(rnd() * 256);
          px.data[i + 3] = 255;
        }
        ctx.putImageData(px, 0, 0);

        const cv2 = document.createElement('canvas');
        cv2.width = 8;
        cv2.height = 8;

        c2.fillStyle = '#1677ff';
        c2.fillRect(0, 0, 8, 8);

          c.setAttribute('cy', String((i * 7) % 48));
          c.setAttribute('r', '1');

      /**
       * 嗅探夹具的两张卡片图 URL 是 `https://sniff-smoke.test/*.png`（尺寸探测走 GM 桩，从不出网），
       * `<img>` 真加载必然失败 ⇒ 卡片盒子只剩破图的高度（实测 24px），比按钮条（26px）还矮，

       * 嗅探的尺寸结论（HEAD 30 KB / Range 40 KB）在扫描阶段就已经算完，不受影响。

      window.__renderSniffCardImages = (root) => {
        const modal = root || window.__findSniffModal();
        if (!modal) return 0;
        let n = 0;

        const empty = { labels: labels, btns: 0, iconOnly: false, hidden: false, inside: false, bottomRight: false };
        if (!root) return empty;

          btns: btns.filter(Boolean).length,

          hidden: btns.every((b) => !!b && getComputedStyle(b).visibility === 'hidden'),
          inside:
            br.width > 0 &&
            br.left >= ir.left - 1 &&
            br.right <= ir.right + 1 &&
            br.top >= ir.top - 1 &&
            br.bottom <= ir.bottom + 1,
          // 用绝对值：按钮既不能离右下角太远（inside 会先挡住「跑到图片外」），也不能缩在图片中间

          barRect: { x: Math.round(br.x), y: Math.round(br.y), w: Math.round(br.width), h: Math.round(br.height) },

            .slice(0, 3)

      setTimeout(() => {

                  mime: sent.mime,

          // 「兜底没被走到」才是中继优先真的生效的直接证据；同时面板照常渲染出合集与图。
          emojiRelayFirstOk: (() => {
            const r = window.__emojiReq || {};

              r.relayImage >= 1 &&

          // 需求①：表情包图片不进「全部文件」（v26.10.14-v3）。
          // 判据见 19000ms 那拍的 filesAfterEmoji 快照：A 会话清空后只剩表情图，
          // 全部文件应只有 B 会话的文本（图片 0）——过滤失效会变成图片 1。
          emojiNotInFilesOk: (() => {

          // 方案 B：antd 浮层（Modal/Drawer…）必须盖在面板之上
          // （面板宿主 999999 < zIndexPopupBase 1000000）
          overlayAbovePanel: (() => {
            const host = document.getElementById('__znhd_panel_host__');
            const modalWrap = document.querySelector('.ant-modal-wrap, .ant-drawer');
            if (!host || !modalWrap) return false;

          })(),
          // 浮层必须按**视口**定尺寸（v26.10.09-v6 回归断言）。
          //
          // 本页常驻 `body { transform: translateZ(0) }`（模拟税务页）：若浮层的 portal 目标是
          // `documentElement` 而不是「挂在 documentElement 下的自建 div」，antd/rc-util 的 Portal
          // 会**实际落进 body** ⇒ `position:fixed` 改以 body 的盒子为包含块 ⇒
          // 抽屉/弹窗的高度塌成 body 的高度（实测 117px，应为视口高 800），按钮落在盒子之外、
          // 鼠标事件到不了（表现为「常用语 hover 测不出来 / 点击区域错位」）。
          // ⚠️ 判据用**几何**而不是「容器是谁」：portal 落点会随 React/antd 版本变化，
          //    而「开着的浮层必须有视口那么高」是用户可观察的契约。
          // ⚠️ 只统计**可见**的浮层：antd 会把关闭过的浮层留在 DOM 里（display:none），

          overlayViewportSized: (() => {
            const visible = Array.from(document.querySelectorAll('.ant-drawer, .ant-modal-wrap')).filter((el) => {

          panel: text.includes('征纳互动监控'),
          // 版本号只从「面板宿主」里取：弹窗（更新日志/日志/常用语…）都 portal 到 documentElement，
          // 里面有各自的版本号文本，读全页会串台（v26.10.6-v1 踩过）。
          // v26.10.06-v9 起面板不再是 Shadow DOM，改为按宿主 id 取。
          version: (() => {
            const host = document.getElementById('__znhd_panel_host__');
            return ((host && host.textContent) || '').match(/v\d+\.\d+\.\d+-v\d+/)

              : '<无>';
          })(),
          // 常用语成功路径（YAML 解析出按钮）
          phrasesLoaded: text.includes('冒烟常用语A'),
          phrasesClicked: !!window.__clickedPhrases,
          // 更新日志：入口可点 → 弹窗出现 → 渲染 mock 正文 → 底部按钮 → 条数提示（12 条只渲染 10）
          settingsClicked: !!window.__clickedSettings,
          changelogClicked: !!window.__clickedChangelog,
          changelogPopup: !!popup && text.includes('冒烟更新日志标记行'),
          changelogMoreBtn: !!popup && text.includes('获取更多日志'),
          changelogLimitHint: !!popup && text.includes('共 12 条，已显示最新 10 条'),
          // 点缩略图放大：主图必须真的渲染出来（v26.10.8-v1 回归断言）
          viewerZoom: window.__viewerZoom || null,
          viewerZoomOk: !!(
            window.__viewerZoom &&
            window.__viewerZoom.container &&
            window.__viewerZoom.decoded &&
            window.__viewerZoom.visible

          // 图片复制：**只允许尝试写 image/png**。
          // 旧实现「先按原图类型（jpeg）写一次、失败再转 PNG 重试」会命中
          // ClipboardItem.supports('image/jpeg') === false，且那一次失败已按规范消耗掉用户手势，

          copyWriteTypes: window.__copyWriteTypes || [],
          copyOk: (() => {

            const recs = window.__copyWriteTypes || [];
            if (!recs.length) return false; // 一次都没发起写入 → 代码没走到写入路径
            let sawPng = false;
            let bad = null;
            recs.forEach((rec) =>
              (rec || []).forEach((types) =>
                (types || []).forEach((t) => {
                  if (t === 'image/png') sawPng = true;
                  else bad = t;
                })

            return sawPng && bad === null;
          })(),
          // 打印（v26.10.08-v1 引入 / v26.10.08-v2 挪进放大预览工具栏）：
          // ① 按钮必须长在 antd 预览工具栏的胶囊容器（.ant-image-preview-actions）**里面**且带图标；
          // ② 点了之后 react-to-print 真的建出 id=printWindow 的打印 iframe（= 内容节点被找到，整条链路接通）。
          printBtnOk: !!window.__printBtnSeen && !!window.__printBtnInActions,
          printIframeOk: !!window.__printIframeSeen,
          // A4 自适应（v26.10.08-v4；v5 起含「无页眉页脚」）：打印文档里必须同时具备
          //   ① `@page { size: A4 … }`（纸型）；② `@page` 的 margin 为 0（否则浏览器会画页眉页脚）；
          //   ③ 内容框 `box-sizing: border-box` + 毫米尺寸且不大于 A4（超了必溢出纸张）；
          //   ④ 内容框有正的 padding（图片离纸边的留白由它提供，不是靠 @page margin）；
          //   ⑤ 图片 `object-fit: contain`（等比缩放居中）。
          // 只锁「语义」不锁具体数字：改页边距/留白常量不该把断言打红，但版式写错一定会红。
          printA4Ok: (() => {
            const d = window.__printDoc;
            if (!d || !d.pageA4 || !d.pageMarginZero) return false;
            if (!/object-fit:\s*contain/i.test(d.imgStyle || '')) return false;
            const s = d.boxStyle || '';
            if (!/box-sizing:\s*border-box/i.test(s)) return false;
            const m = /width:\s*([\d.]+)mm;\s*height:\s*([\d.]+)mm/.exec(s);
            if (!m) return false;
            if (!(parseFloat(m[1]) <= 210 && parseFloat(m[2]) <= 297)) return false;
            const pad = /padding:\s*([\d.]+)mm/.exec(s);
            return !!pad && parseFloat(pad[1]) > 0;
          })(),
          // 预览工具栏的挂载与层级（v26.10.08-v7）：宿主页 body 带 transform 时（本页已常驻该规则），
          // 预览必须仍在**视口内**、且「打印」按钮正中心的最上层仍是工具栏自己（= 没被放大后的图片盖住）。
          previewToolbarOk: !!(window.__snap && window.__snap.footerInViewport && window.__snap.footerHit),
          // 预览工具栏的图标必须与按钮同一水平线（v26.10.08-v8）：
          // 本页常驻的宿主页规则 `svg { margin: -2.75em auto 0 }` 会把图标整体顶出胶囊
          // （实测偏移 25px）⇒ 图标落到胶囊上方、与背景同色而「看不见，只剩一条灰色胶囊」。
          // 这条守的是 uiReset 的 svg 复位规则必须覆盖 `.ant-image-preview svg`（漏了就会红）。
          previewIconCenteredOk: !!(window.__snap && window.__snap.iconsCentered),
          // 「预览打开时只能有**一层**遮罩」（v26.10.08-v9）：

          // （两层 rgba(0,0,0,0.45) 合成 0.6975，白底灰度 77；单层是 140 —— 用户反馈的「没官方明亮」）。
          previewSingleMaskOk: !!(window.__snap && window.__snap.singleMask),

          timeInputsOk: (() => {

            if (els.length !== 4) return false;

          // 常用语必须是 antd **Drawer**（侧边栏），不是 Modal：v26.10.06-v14 按需求改的。

          //    v6 已把它改名为 `.ant-drawer-section`，用旧名会假失败（本条踩过）。
          phrasesIsDrawer: !!document.querySelector('.ant-drawer.ant-drawer-right .ant-drawer-body'),
          // 发送到手机：必须先压缩再发（v26.10.06-v6 回归断言）。判定要点：

          phoneSendCheck: window.__phoneSendCheck || null,
          phoneSendCompressedOk: !!(
            window.__phoneSendCheck &&
            window.__phoneSendCheck.got &&
            window.__phoneSendCheck.jpegMagic &&
            Math.max(window.__phoneSendCheck.w || 0, window.__phoneSendCheck.h || 0) <= 1600 &&
            window.__phoneSendCheck.bytes < (window.__phoneSendCheck.originalBytes || Infinity)

          xhr: window.__gmXhrLog.slice(0, 6),
          // v26.10.10-v17：常用语实际请求的数据源地址（用来断言「旧默认值被迁移到 cnb.cool 新默认」）。
          // 夹具在脚本加载前预置了旧默认地址，所以这里必须看到 cnb.cool；否则说明迁移没生效。
          phrasesSourceUrl: (function () {
            const hit = window.__gmXhrLog.find(function (line) {
              return line.indexOf('commonPhrases.yaml') >= 0;
            });
            return hit || '';
          })(),
          // ===== 样式隔离断言（v26.10.06-v11）=====
          // 宿主页面把 html/body 设成 text-align:center、且要求 content-box，
          // 面板/弹窗必须仍保持左对齐、盒模型正确 —— 否则就是隔离层失效（用户实测反馈过）。
          modalTextAlignLeft: (() => {
            const body = document.querySelector('.ant-modal-body');

          })(),
          // 图标必须与所在控件垂直居中（±2px）——守卫「第三方样式给 svg 加负 margin 把图标顶出控件」。
          // v26.10.06-v16 起 antd TimePicker 换回原生 input，原时钟图标已不存在，故改为量同类对象：
          // 输入框「清空 ×」→ 弹窗关闭图标 → 侧边栏关闭图标，取第一个存在且有高度的。
          iconVerticallyCentered: (() => {
            const pairs = [
              ['.ant-input-affix-wrapper', '.ant-input-clear-icon'],
              ['.ant-modal-close', '.ant-modal-close-x svg'],
              ['.ant-drawer-close', '.ant-drawer-close svg'],
            ];
            for (const pair of pairs) {
              const box = document.querySelector(pair[0]);
              const icon = document.querySelector(pair[1]);
              if (!box || !icon) continue;
              const a = box.getBoundingClientRect();
              const b = icon.getBoundingClientRect();
              if (!b.height) continue;
              return Math.abs(a.top + a.height / 2 - (b.top + b.height / 2)) <= 2;
            }
            return false;
          })(),
          // 图片嗅探（v26.10.10-v4）：入口 + 三路来源 + 整条尺寸阶梯 + 未知不丢 + 阈值过滤
          // + perf 优先（v26.10.14-v2：同源图零请求走资源表读数）
          sniffEntryOk: !!(window.__sniffSnap && window.__sniffSnap.entrySeen && window.__sniffSnap.modalSeen),
          sniffScanOk: !!(
            window.__sniffSnap &&
            window.__sniffSnap.cards >= 2 &&
            window.__sniffSnap.sourcesCss &&
            window.__sniffSnap.headSize &&
            window.__sniffSnap.rangeSize &&
            // v26.10.10-v7：SVG 全被后缀规则挡在面板外，故这里反过来要求「面板里没有 SVG 来源」
            !window.__sniffSnap.sourcesSvg
          ),
          sniffUnknownKeptOk: !!(window.__sniffSnap && window.__sniffSnap.unknownCount >= 1),
          // v26.10.14-v2：尺寸读取 perf 优先 —— 同源真加载的图零请求拿到字节数
          // （预收 Map 由 document-start 起的 PerformanceObserver 持续抄录，脚本执行前加载的图
          // 靠 observer 的 buffered:true 回放）。走到 HEAD 就假红。
          sniffPerfFirstOk: !!(
            window.__sniffSnap &&
            window.__sniffSnap.perfCardSeen &&
            window.__sniffSnap.perfSizePerf &&
            window.__sniffSnap.perfBogusNotShown &&
            window.__sniffSnap.perfViaLabel &&
            window.__sniffSnap.perfNoHead
          ),
          // 图片嗅探（v26.10.10-v6，用户反馈）：小于阈值的图不显示、不计数、也不进全选/批量下载范围。
          // 判据：① 面板不再出现「小于阈值」字样；② 10 KB 的 ⑦ 不在任何卡片标题里；
          // ③ 点「全选」后按钮文案的张数 === 已渲染卡片数 + 大小未知数（含被阈值过滤的那张就会多 1）。
          sniffSelectScopeOk: !!(
            window.__sniffSnap &&
            window.__sniffSnap.selectAllClicked &&
            !window.__sniffSnap.belowNoticeShown &&
            !window.__sniffSnap.smallInTitles &&
            window.__sniffSnap.selectAllCount ===
              window.__sniffSnap.cards + window.__sniffSnap.unknownCount &&
            window.__sniffSnap.selectAllCount >= 1
          ),
          // 图片嗅探（v26.10.10-v5）：名称排除——命中规则的图不进候选（连请求都不发），
          // 面板给出排除计数，且被排除的名字一个都不许出现在卡片标题里。
          sniffExcludeOk: !!(
            window.__sniffSnap &&
            window.__sniffSnap.excludedCount >= 2 &&
            !window.__sniffSnap.excludedNameInTitles
          ),
          // 后缀排除（v26.10.10-v7）：URL 是 .svg 的与内联 SVG 都不进面板。
          // excludedCount >= 4 = 名称规则那 3 张（data 大/小 + user-man）+ 至少 1 张 SVG。
          sniffSvgExcludedOk: !!(
            window.__sniffSnap &&
            !window.__sniffSnap.svgUrlInTitles &&
            !window.__sniffSnap.svgInTitles &&
            window.__sniffSnap.excludedCount >= 4
          ),
          // 会话分组（v26.10.13-v8）：两张会话图各归各的组，当前会话置顶，未归属单独成组。
          // 判据（三条一起看，缺一条都说明归属/排序/渲染有一处没接上）：
          //   ① 恰好 3 组：刘永增 / 湖南博大园林建筑有限公司 / 未归属（name 为空串）；
          //   ② 「当前会话」标签落在第 0 组（= Vuex 的 selectItem 那一组）；
          //   ③ 每组的卡片数与卡片标题对得上（a 图在第 0 组、b 图在第 1 组，各 1 张）。
          sniffGroupOk: (() => {
            const s = window.__sniffSnap;
            const g = s && s.groups;

            return !!(
              s.chatInstalled &&
              g.count === 3 &&
              g.names[0] === '刘永增' &&
              g.names[1] === '湖南博大园林建筑有限公司' &&
              g.names[2] === '' &&
              g.currentIndex === 0 &&
              g.cards[0] === 1 &&
              g.cards[1] === 1 &&
              g.titles[0].indexOf('sniff-conv-a.png') >= 0 &&
              g.titles[1].indexOf('sniff-conv-b.png') >= 0 &&
              g.headers[0].indexOf('1 张') >= 0

          })(),
          // 会话归属的持久化（v26.10.13-v8）：切走会话（Vuex 里两条消息都不再提供）后重扫，
          // 两张图仍各自归回原会话 —— 少了持久层的话它们只会落进「未归属」，names 前两项都是空串。
          sniffGroupPersistOk: (() => {
            const s = window.__sniffSnap;
            const g = s && s.groupsAfterSwitch;
            if (!g) return false;
            return !!(
              s.rescanClicked &&
              s.switchedSeen &&
              g.count === 3 &&
              g.names[0] === '湖南博大园林建筑有限公司' &&
              g.names[1] === '刘永增' &&
              g.names[2] === '' &&
              g.currentIndex === 0 &&
              g.cards[0] === 1 &&
              g.cards[1] === 1
            );
          })(),
          // v26.10.10-v16：图片格子上的功能按钮改成「压在图片右下角、只有图标、hover 才出现」。
          // 文件视图（复制/下载/删除）与图片嗅探（下载/打印）两个窗口都要满足同一组几何与可见性约束。
          filesImgActions: window.__filesImgActions || null,
          sniffImgActionsOk: (() => {
            const s = window.__sniffSnap && window.__sniffSnap.imgActions;
            return !!(
              s &&
              s.btns === 2 &&
              s.iconOnly &&
              s.hidden &&
              s.inside &&
              s.bottomRight &&
              window.__sniffSnap.imgActionsHovered
            );
          })(),
          sniffSnap: window.__sniffSnap || null,
          transferSnap: window.__transferSnap || null,
          pairSnap: window.__pairSnap || null,
          relevantErrors: relevant,
        };
        document.getElementById('smoke-result').textContent = JSON.stringify(report, null, 2);
        document.title =
          'znhd-smoke:' +
          (report.panel &&
          report.overlayViewportSized &&
          report.panelIconsAreSvg &&
          report.transferAutoOpenOk &&
          report.transferWindowOk &&
          report.transferNoTitleOk &&
          report.filesViewOk &&
          report.sessionChatOk &&
          report.sessionRouteBySenderOk &&
          report.textSentOk &&
          report.sessionClearOk &&
          report.pairModalOk &&
          report.qrNoRadius &&
          report.phoneIdColorOk &&
          report.pairTestImageBtnOk &&
          report.testImageSentOk &&
          report.transferThemeOk &&
          report.transferLayeredOk &&
          report.transferSettingsIsolatedOk &&
          report.phrasesLoaded &&
          report.changelogPopup &&
          report.viewerZoomOk &&
          report.copyOk &&
          report.printBtnOk &&
          report.printIframeOk &&
          report.printA4Ok &&
          report.previewToolbarOk &&
          report.previewIconCenteredOk &&
          report.previewSingleMaskOk &&
          report.filesImgActionsOk &&
          report.chatBubbleOk &&
          report.chatComposerOk &&
          report.emojiPackOk &&
          // 表情面板的两条自动收起（v26.10.13-v7）。顺手把同一族的 emojiHoverOk 也纳入总门禁
          // （此前只在明细里报，未参与 ALL-OK 判定）
          report.emojiHoverOk &&
          report.emojiAutoCloseOk &&
          report.phoneSendCompressedOk &&
          report.sniffEntryOk &&
          report.sniffScanOk &&
          report.sniffUnknownKeptOk &&
          report.sniffPerfFirstOk &&
          report.sniffExcludeOk &&
          report.sniffSvgExcludedOk &&
          report.sniffSelectScopeOk &&
          // 会话分组（v26.10.13-v8）：分组渲染 + 切会话后仍靠持久层归组
          report.sniffGroupOk &&
          report.sniffGroupPersistOk
            ? 'ALL-OK'
            : 'PARTIAL');
      }, 38500);
