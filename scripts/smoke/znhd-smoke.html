<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>znhd 冒烟测试</title>

    <!-- ===== 模拟真实宿主页面的「敌意 CSS」=====
         本脚本的面板/弹窗是注入到**别人页面**里的：税务页有全局 text-align:center、
         非 border-box 盒模型、自定义 svg 对齐等规则，会污染 antd 组件外观
         （v26.10.06-v11 的「弹窗文字全居中 + 输入框图标偏移」就是这么来的）。
         这里常驻几条同类规则，作为样式隔离层（lib/ui/uiReset.ts + 弹窗 styles.body）的回归守卫。 -->
    <style>
      html,
      body {
        text-align: center; /* 旧代码靠显式 textAlign:'left' 守，去掉就会整屏居中 */
      }
      body * {
        box-sizing: content-box; /* 非 border-box，验证隔离层是否复位 */
      }
      /* 实测抓到的真凶：某第三方样式给 svg 加了负上边距（用户环境里时钟图标的
         margin: -2.75em auto 0 ≈ -44px），把 antd 图标整体顶出输入框。
         常驻这条规则，「时间图标与输入框同一水平线」断言才有牙齿。 */
      svg {
        margin: -2.75em auto 0;
      }
      /* ★ v26.10.08-v7：税务页 body 上带 transform 会形成独立层叠上下文，把 position:fixed 的浮层
         **困在 body 的盒子里**（本仓库 panelHost.tsx 有结论）。这里常驻这条规则，守卫两类事情：
           ① 我们的面板/弹窗挂 documentElement ⇒ 不受影响；
           ② antd Image 预览默认挂 body ⇒ 必须显式 getContainer 改挂 documentElement，否则工具栏会被推出视口、
             表现为「放大后图片盖住了下方的操作栏」（真实用户反馈的就是这个）。
         实测（1280×800、页面滚到 y=600）：不修时预览根 y=-579/h=3000、工具栏 y=2330（视口外）。 */
      body {
        transform: translateZ(0);
      }
    </style>

    <!-- ===== GM API 桩（模拟油猴环境 + 按真实中继协议返回数据） ===== -->
    <script>
      // 先落一份干净的配置（脚本读 localStorage，不读 GM_getValue）
      localStorage.removeItem('scriptCat_PhrasesCache');
      localStorage.removeItem('scriptCat_PanelPoint');
      localStorage.setItem('scriptCat_Allvalue', JSON.stringify({ voiceEnabled: false, useCdn: true }));

      window.__gmXhrLog = [];
      const PNG_1x1 =
        'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==';
      // 收到图片的载荷：用 canvas 生成一张**真实尺寸**的 JPEG（480×360），而不是 1×1 占位 PNG。
      // 原因：断言里要校验「放大后主图有可见尺寸」（rect > 10px），而 1×1 的图 Viewer 只会渲染成 1px，
      // 该判定形同虚设（v26.10.8-v1 加断言时踩过：canvasImg/decoded 都 true，只有 visible 因 1px 为 false）。
      const SMOKE_IMG_B64 = (() => {
        try {
          const c = document.createElement('canvas');
          c.width = 480;
          c.height = 360;
          const ctx = c.getContext('2d');
          ctx.fillStyle = '#e6f2ff';
          ctx.fillRect(0, 0, 480, 360);
          for (let i = 0; i < 40; i++) {
            ctx.fillStyle = 'hsl(' + ((i * 37) % 360) + ',70%,55%)';
            ctx.fillRect((i * 53) % 420, (i * 97) % 300, 60, 50);
          }
          return c.toDataURL('image/jpeg', 0.8).split(',')[1];
        } catch (e) {
          return PNG_1x1; // canvas 不可用时退回占位图（可见尺寸断言会因此失败，属预期）
        }
      })();
      const PHRASES_YAML = ['冒烟常用语A: |', '  A 的内容', '冒烟常用语B: |', '  B 的内容', ''].join('\n');
      // 更新日志：给 12 条，验证「默认只显示最新 10 条」+ 条数提示（多出的 2 条不渲染）
      const CHANGELOG_MD = (() => {
        const parts = ['# 更新日志', '', '本文件是唯一来源。', '', '---', ''];
        for (let i = 1; i <= 12; i++) {
          parts.push('### znhd.user.js v99.0.' + i + '-v1');
          parts.push('');
          parts.push(i === 1 ? '- 冒烟更新日志标记行' : '- 第 ' + i + ' 条日志内容');
          parts.push('');
        }
        return parts.join('\n');
      })();

      // 剪贴板写入桩：只**记录**每次 clipboard.write 的条目类型并直接拒绝。
      // 这样无需真实剪贴板权限即可断言「代码有没有先拿不支持的 jpeg 去试」——
      // headless 里图片剪贴板根本写不进去（实测即使只写一次 image/png 也会被拒），
      // 所以断言只能锁「尝试的类型」这个不变量，不能锁「写成功」。
      window.__copyWriteTypes = [];
      try {
        if (typeof Clipboard !== 'undefined' && Clipboard.prototype && Clipboard.prototype.write) {
          Clipboard.prototype.write = function (items) {
            window.__copyWriteTypes.push(Array.prototype.map.call(items, (i) => i.types));
            return Promise.reject(new DOMException('smoke-stub: 桩环境不支持写剪贴板', 'NotAllowedError'));
          };
        }
      } catch (e) {
        /* 忽略：环境没有 Clipboard 时断言会因「零次调用」而失败，属预期 */
      }

      // 打印（v26.10.08-v1 起）：react-to-print 会往 body 挂一个 id=printWindow 的隐藏 iframe。
      // ⚠️ headless 里没有打印对话框，且桌面 UA 下打印完成后 iframe 会被立刻移除，
      //    所以不能用「iframe 还在不在」判断，必须用 MutationObserver 在**插入那一刻**记录。
      // 该 iframe 只在「找到了打印内容节点」时才会被挂上（react-to-print 拿不到内容会直接 return），
      // 因此它出现 = 「按钮 → printImage → doPrint」整条链路真的接通了。
      // v26.10.08-v4 起再往里看一眼**打印文档本身**：A4 版式（@page size:A4 + 图片框毫米尺寸 + object-fit）
      // 必须真的注入到 iframe 里，而不是只写在源码里。
      // 时序说明：react-to-print 是先给 iframe 赋 onload、再 appendChild；我们的监听注册在其后，
      // 所以本回调触发时它已经把内容克隆进 body、并把 pageStyle 追加进 head 了。
      window.__printIframeSeen = false;
      window.__printDoc = null;
      try {
        new MutationObserver((muts) => {
          muts.forEach((m) =>
            Array.prototype.forEach.call(m.addedNodes, (n) => {
              if (n && n.id === 'printWindow') {
                window.__printIframeSeen = true;
                n.addEventListener('load', () => {
                  try {
                    const doc = n.contentDocument;
                    const img = doc && doc.querySelector('img');
                    const box = doc && doc.querySelector('body > div');
                    const styles = doc
                      ? Array.from(doc.querySelectorAll('style')).map((s) => s.textContent || '')
                      : [];
                    window.__printDoc = {
                      hasImg: !!img,
                      pageA4: styles.some((t) => /@page/.test(t) && /size:\s*A4/i.test(t)),
                      // 页眉页脚（v26.10.08-v5）：浏览器把标题/URL/日期/页码画在**页边距**里，
                      // 故 `@page` 的 margin 必须为 0 —— 没边距它们就没地方画（CSS 无法直接取消那个勾选项）。
                      pageMarginZero: styles.some((t) => /@page\s*\{[^}]*margin:\s*0\s*[;}]/.test(t)),
                      boxStyle: box ? box.getAttribute('style') : null,
                      imgStyle: img ? img.getAttribute('style') : null,
                    };
                  } catch (e) {
                    window.__printDoc = { error: String((e && e.message) || e) };
                  }
                });
              }
            })
          );
        }).observe(document.documentElement, { childList: true, subtree: true });
      } catch (e) {
        /* 忽略：不支持 MutationObserver 时断言会因「从未见到 iframe」而失败，属预期 */
      }

      // extra 用来覆盖默认字段（status/responseHeaders/response），图片嗅探夹具要用到
      const reply = (details, payload, extra) => {
        setTimeout(() => {
          if (typeof details.onload === 'function') {
            details.onload({
              status: 200,
              statusText: 'OK',
              responseText: typeof payload === 'string' ? payload : JSON.stringify(payload),
              responseHeaders: '',
              finalUrl: details.url,
              ...(extra || {}),
            });
          }
        }, 40);
      };

      window.GM_info = {
        // 由 run.js 从构建产物的 ==UserScript== 头读出真实 @version 注入（evaluateOnNewDocument），
        // 这样「面板渲染的版本号」才是对产物的真实校验，而不是桩里的死值
        script: { version: window.__scriptVersion || '0.0.0-v0' },
        scriptHandler: 'smoke-harness',
        scriptUpdateURL: 'https://example.invalid/znhd.user.js',
        scriptWillUpdate: false,
      };
      window.unsafeWindow = window;
      window.GM_getValue = (k, d) => (k in (window.__store || {}) ? window.__store[k] : d);
      window.GM_setValue = (k, v) => {
        window.__store = window.__store || {};
        window.__store[k] = v;
      };
      window.GM_addStyle = (css) => {
        const s = document.createElement('style');
        s.textContent = css;
        document.head.appendChild(s);
        return s;
      };
      window.GM_setClipboard = () => {};
      window.GM_getResourceText = () => '';
      window.GM_notification = () => {};
      window.GM_addValueChangeListener = () => {};

      window.GM_xmlhttpRequest = (details) => {
        const url = String((details && details.url) || '');
        window.__gmXhrLog.push(((details && details.method) || 'GET') + ' ' + url);

        // 常用语 YAML：走成功路径
        if (url.includes('commonPhrases.yaml')) {
          reply(details, PHRASES_YAML);
          return { abort: () => {} };
        }
        // 更新日志 changelogs/YYYY-MM.md（当月文件）：走成功路径
        if (url.includes('changelogs/')) {
          reply(details, CHANGELOG_MD);
          return { abort: () => {} };
        }
        // 「发送测试图片」（v26.10.08-v10）随机图源：返回一张**真 Blob**（我们的代码用 responseType:'blob'）
        if (url.indexOf('t.alcy.cc') >= 0) {
          const cv = document.createElement('canvas');
          cv.width = 200;
          cv.height = 150;
          const ctx = cv.getContext('2d');
          ctx.fillStyle = '#7c3aed';
          ctx.fillRect(0, 0, 200, 150);
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 24px sans-serif';
          ctx.fillText('TEST', 62, 88);
          cv.toBlob((b) => {
            setTimeout(() => {
              if (typeof details.onload === 'function') {
                details.onload({
                  status: 200,
                  statusText: 'OK',
                  response: b,
                  responseText: '',
                  responseHeaders: 'content-type: image/png',
                  finalUrl: url,
                });
              }
            }, 40);
          }, 'image/png');
          return { abort: () => {} };
        }
        // 「发送测试图片」投递：POST /u/<deviceId>（手机上传同一条路径）→ 记录载荷供断言
        if (/\/u\/[a-z0-9-]{8,64}$/i.test(url) && String(details.method || '').toUpperCase() === 'POST') {
          try {
            window.__testImageSent = JSON.parse(details.data || '{}');
          } catch (e) {
            window.__testImageSent = { parseErr: String((e && e.message) || e) };
          }
          reply(details, { ok: true });
          return { abort: () => {} };
        }
        // 手机在线状态：模拟**两台**手机在线（v26.10.06-v4：多手机 + 定向投递相关断言）。
        // 两个 ID 前 8 位不同，才能验证「按短 ID 区分展示」不会把两台显示成同一个。
        if (/\/phone\/status\//.test(url)) {
          reply(details, {
            online: true,
            phones: [
              { id: '11111111-1111-4111-8111-111111111111', lastSeen: Date.now() },
              { id: '22222222-2222-4222-8222-222222222222', lastSeen: Date.now() },
            ],
          });
          return { abort: () => {} };
        }
        // 发送到手机：记录实际 POST 的载荷，用于校验「先压缩再发」（v26.10.06-v6 回归断言）
        if (/\/phone\/send\//.test(url)) {
          try {
            window.__phoneSent = window.__phoneSent || [];
            window.__phoneSent.push(JSON.parse((details && details.data) || '{}'));
          } catch (e) {
            window.__phoneSendErr = String((e && e.message) || e);
          }
          reply(details, { ok: true });
          return { abort: () => {} };
        }
        // 中继收件长轮询：先空响应确认连接，再给一条文本、一张图片，之后空转
        if (/\/recv\//.test(url)) {
          const n = (window.__recvCount = (window.__recvCount || 0) + 1);
          if (n === 1) reply(details, { empty: true });
          else if (n === 2)
            reply(details, { type: 'text', text: '冒烟测试文本：收到一条文本消息', ts: Date.now() });
          else if (n === 3)
            reply(details, {
              type: 'image',
              name: 'smoke.jpg',
              mime: 'image/jpeg',
              data: SMOKE_IMG_B64,
              ts: Date.now(),
            });
          else reply(details, { empty: true });
          return { abort: () => {} };
        }
        // ===== 图片嗅探夹具（v26.10.10-v4）：按 URL 分支作答，覆盖测量阶梯 =====
        // ③ HEAD 给 content-length（走「HEAD 响应头」阶梯 → 30720 B = 30 KB）
        if (url.indexOf('/sniff-head.png') >= 0) {
          reply(details, '', { responseHeaders: 'content-type: image/png\ncontent-length: 30720' });
          return { abort: () => {} };
        }
        // ④ HEAD 故意不给 content-length（逼出 Range 阶梯）→ Range GET 回 40960 B 的 Blob = 40 KB
        if (url.indexOf('/sniff-range.png') >= 0) {
          if (String(details.method || 'GET').toUpperCase() === 'HEAD') {
            reply(details, '', { responseHeaders: 'content-type: image/png' });
            return { abort: () => {} };
          }
          reply(details, '', {
            response: new Blob([new Uint8Array(40960)], { type: 'image/png' }),
            responseText: '',
            responseHeaders: 'content-type: image/png',
          });
          return { abort: () => {} };
        }
        // ⑨ .svg 文件（v26.10.10-v7）：后缀命中排除规则 ⇒ 连请求都不会发（桩留着是为了反向验证时看得出来）
        if (url.indexOf('/media/icon.svg') >= 0) {
          reply(details, '', { responseHeaders: 'content-type: image/svg+xml\ncontent-length: 30720' });
          return { abort: () => {} };
        }
        // ⑦ 10 KB 的普通 http 图（名字不命中排除规则）→ 低于阈值：不显示卡片、不计数、不进全选范围（v26.10.10-v6）
        if (url.indexOf('/sniff-small.png') >= 0) {
          reply(details, '', { responseHeaders: 'content-type: image/png\ncontent-length: 10240' });
          return { abort: () => {} };
        }
        // ⑥ HEAD 404：尺寸测不到，但仍是图片 URL ⇒ 必须留在「大小未知」组（不丢）
        if (url.indexOf('/sniff-missing.png') >= 0) {
          reply(details, '', { status: 404, statusText: 'Not Found' });
          return { abort: () => {} };
        }
        // 其它一律失败，观察脚本是否优雅降级
        setTimeout(() => {
          if (details && typeof details.onerror === 'function') {
            details.onerror({ status: 0, statusText: 'smoke-harness-blocked' });
          }
        }, 40);
        return { abort: () => {} };
      };
    </script>

    <!-- ===== 与 userscript @require 完全相同的依赖 =====
         v26.10.06-v9：CAT_UI（脚本猫 UI 库）已移除，面板改为 React 19 + Ant Design v6（随产物打包）。
         v26.10.06-v13：Viewer.js 也已移除——收图放大改用 antd Image.PreviewGroup，故此处不再加载它。 -->
    <script src="https://fastly.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="https://fastly.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://fastly.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.js"></script>
  </head>
  <body>
    <h1>znhd 面板冒烟测试</h1>
    <p>模拟 example.com 调试宿主：脚本会在本页注入浮动面板，并由 GM 桩按真实协议投递文本/图片。</p>

    <!-- 人数监控取 .count:nth-child(2)：本题为 body 的第 2 个子节点 -->
    <div class="count"><span>等待人数</span><span>0</span></div>

    <!-- ===== 图片嗅探夹具（v26.10.10-v4）=====
         全部由本页或 GM 桩作答（域名 *.test 不解析、从不出网），每一种「来源 / 尺寸阶梯」各一条：
           ① data: 大图（>20KB 阈值，本地按 base64 长度算）      → 兜底名 znhd-sniff-N ⇒ 被名称规则排除（v26.10.10-v5）
           ② data: 小图（<20KB）                                → 同上（也被名称规则排除）
           ③ CSS background-image → 桩 HEAD 回 content-length   → HEAD 阶梯（30 KB）
           ④ CSS background-image → 桩 HEAD 不给长度、Range GET → Range 阶梯（40 KB）
           ⑤ 内联 <svg>（运行时补足图元，>20KB）                → 显示名 inline-svg-N.svg ⇒ 被后缀规则排除（v26.10.10-v7）
           ⑥ 懒加载 data-src 指向 HEAD 404 的地址               → 尺寸未知，必须保留在「大小未知」折叠组
         ⑦ 10 KB 的普通 http 图（名字不命中排除规则）         → 被阈值过滤：不显示、不计数、不进全选范围
             ⑧ URL 末段含 user-man 的图                           → 必须被名称规则排除，不出现卡片
             ⑨ URL 末段是 icon.svg 的图                           → 必须被**后缀**规则排除，不出现卡片
           ①②⑤ 的内容在下面用脚本现造，避免在 HTML 里塞几十 KB base64。 -->
    <div id="sniff-fixtures" aria-hidden="true">
      <img id="sniff-data-big" alt="" />
      <img id="sniff-data-small" alt="" />
      <img id="sniff-lazy-unknown" data-src="https://sniff-smoke.test/sniff-missing.png" alt="" />
      <div
        id="sniff-css-head"
        style="width: 40px; height: 40px; background-image: url('https://sniff-smoke.test/sniff-head.png')"></div>
      <div
        id="sniff-css-range"
        style="width: 40px; height: 40px; background-image: url('https://sniff-smoke.test/sniff-range.png')"></div>
      <svg id="sniff-inline-svg" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48"></svg>
      <!-- ⑦ 10 KB（< 20KB 阈值）且名字普通：用来验证「被阈值过滤的图不出现在列表、也不进全选/下载范围」 -->
      <img id="sniff-small-http" src="https://sniff-smoke.test/sniff-small.png" alt="" />
      <!-- ⑧ 名字命中排除规则（URL 末段 user-man.png）：必须被丢掉、不进卡片，只体现在排除计数里 -->
      <img id="sniff-excluded-name" src="https://sniff-smoke.test/media/user-man.png" alt="" />
      <!-- ⑨ 后缀命中排除规则（.svg，v26.10.10-v7）：同样在收集阶段就丢掉，连 HEAD 都不会发 -->
      <img id="sniff-svg-http" src="https://sniff-smoke.test/media/icon.svg" alt="" />
    </div>

    <pre id="smoke-result" style="margin-top: 40px">running…</pre>

    <script>
      window.__errors = [];
      window.addEventListener('error', (e) =>
        window.__errors.push('error: ' + (e.message || e.type) + ' @ ' + (e.filename || '-') + ':' + (e.lineno || '-'))
      );
      window.addEventListener('unhandledrejection', (e) => {
        const r = e.reason;
        window.__errors.push('unhandledrejection: ' + ((r && (r.stack || r.message)) || String(r)));
      });
    </script>

    <!-- ===== ScriptCat Agent 桩（v26.10.10-v10）=====
      只在 ScriptCat v1.4+ 存在的 `CAT.agent.*`。这里给出**全量可用的最小实现**，用来断言
      「入口 → 弹窗 → 建会话 → 流式收分片」这条链路；真实环境里的 LLM / OPFS 不在本 harness 职责内。
      ⚠️ 桩必须在**被测脚本之前**注入：AgentModal 在 render 期就调 detectCatAgent()（纯内存判空）。
      ⚠️ 每条子能力都必须是对象：detectCatAgent 只认 object，缺一项就会整体降级为「不可用」。 -->
    <script>
      (function () {
        const wait = (ms) => new Promise((r) => setTimeout(r, ms));
        window.__catAgentCalls = [];
        const log = (name) => window.__catAgentCalls.push(name);

        const makeStream = (text, onDone) => {
          const chunks = [
            { type: 'thinking_delta', content: '（桩）先想一下' },

      // CAT_UI 把面板挂在 Shadow DOM 里，必须穿透 shadowRoot 才能读到文本
      const collectShadowText = () => {
        let text = '';
        const walk = (root) => {
          root.querySelectorAll('*').forEach((el) => {
            if (el.shadowRoot) {
              text += '\n' + (el.shadowRoot.textContent || '');
              walk(el.shadowRoot);
            }
          });
        };
        walk(document);
        return text;
      };
      // 全页文本：Shadow DOM + documentElement（弹窗挂在 documentElement 下）

        (document.documentElement.innerText || '') +

        (document.documentElement.textContent || '') +
        '\n' +
        collectShadowText();

      // ⚠️ 用「包含」而非精确相等：面板按钮现在带 emoji 前缀（如「⚙️ 设置」「💬 常用语」），
      //    精确匹配会全部点不中（v26.10.06-v9 改制后踩过）。
      const clickByText = (label) => {
        let hit = null;
        const walk = (root) => {
          root.querySelectorAll('*').forEach((el) => {
            if (hit) return;
            if (el.shadowRoot) walk(el.shadowRoot);
            if (!hit && (el.tagName === 'BUTTON' || el.tagName === 'A') && (el.textContent || '').indexOf(label) >= 0) hit = el;
          });
        };
        walk(document);
        if (hit) hit.click();
        return !!hit;
      };

      // 影子 DOM 感知的元素查找（抽屉可能渲染在 shadow root 内，document.querySelectorAll 穿不透）
      const deepQuery = (pred) => {
        let hit = null;
        const walk = (root) => {
          root.querySelectorAll('*').forEach((el) => {
            if (hit) return;
            if (el.shadowRoot) walk(el.shadowRoot);
            if (!hit && pred(el)) hit = el;
          });

        walk(document);
        return hit;
      };

      // 造一张 3000x2000 的大图（最长边远超压缩上限 1600），用于验证「发送到手机」会先压缩
      const makeBigFile = () =>
        new Promise((res) => {
          const cv = document.createElement('canvas');
          cv.width = 3000;
          cv.height = 2000;
          const ctx = cv.getContext('2d');
          ctx.fillStyle = '#1e7d5a';
          ctx.fillRect(0, 0, 3000, 2000);
          for (let i = 0; i < 200; i++) {
            ctx.fillStyle = 'hsl(' + (i * 5) + ',80%,50%)';
            ctx.fillRect((i * 137) % 3000, (i * 89) % 2000, 160, 120);
          }
          cv.toBlob((b) => res(new File([b], 'smoke-big.jpg', { type: 'image/jpeg' })), 'image/jpeg', 0.95);
        });

      // 图片嗅探夹具内容（v26.10.10-v4）：
      //   ① data: 大图用**定种子伪随机**填像素 —— 纯色/规则渐变会被 PNG 压到几 KB，噪声才稳定 >20KB；
      //   ② data: 小图用 8x8 纯色，稳定 <20KB；
      //   ⑤ 内联 SVG 补 600 个 circle（序列化后约 35KB），否则不够阈值、不会出现在列表里。
      (function () {
        let seed = 123456789;
        const rnd = () => ((seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648);
        const cv = document.createElement('canvas');
        cv.width = 160;
        cv.height = 160;
        const ctx = cv.getContext('2d');
        const px = ctx.createImageData(160, 160);
        for (let i = 0; i < px.data.length; i += 4) {
          px.data[i] = Math.floor(rnd() * 256);
          px.data[i + 1] = Math.floor(rnd() * 256);
          px.data[i + 2] = Math.floor(rnd() * 256);
          px.data[i + 3] = 255;
        }
        ctx.putImageData(px, 0, 0);

      setTimeout(() => {
        // v26.10.06-v17：按钮文案按参考稿改为「发送 N 张图片」（原「发送 N 张图片到手机」），
        // 故用「张图片」匹配（唯一命中该按钮；选图按钮文案是「选择 / 添加图片」，不含「张图片」）
        const btn = deepQuery((el) => el.tagName === 'BUTTON' && (el.textContent || '').indexOf('张图片') >= 0);
        window.__clickedSendImg = !!btn;
        if (btn) btn.click();
      }, 9000);
      // 解出实际 POST 的字节：必须是 JPEG、最长边 ≤1600、且比原图小
      setTimeout(() => {
        const sent = (window.__phoneSent || [])[0];
        if (!sent || !sent.data) {
          window.__phoneSendCheck = { got: false, sentCount: (window.__phoneSent || []).length };
          return;
        }
        try {
          const bin = atob(sent.data);
          const arr = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
          const jpegMagic = arr[0] === 0xff && arr[1] === 0xd8;
          createImageBitmap(new Blob([arr], { type: sent.mime || 'image/jpeg' }))
            .then((bmp) => {
              window.__phoneSendCheck = {
                got: true,
                mime: sent.mime,
                name: sent.name,
                bytes: arr.length,
                originalBytes: window.__sentOriginalSize || 0,
                w: bmp.width,
                h: bmp.height,
                jpegMagic: jpegMagic,
              };
              bmp.close();
            })
            .catch((e) => {
              window.__phoneSendCheck = {
                got: true,
                mime: sent.mime,
                bytes: arr.length,
                decodeErr: String((e && e.message) || e),
              };
            });
        } catch (e) {
          window.__phoneSendCheck = { got: false, err: String((e && e.message) || e) };
        }
      }, 10300);

      // ===== 图片嗅探（v26.10.10-v4）=====
      // 点面板第 5 个入口 → 弹窗自动扫描页面（夹具见 #sniff-fixtures）。
      // 扫描是异步的（每张 HEAD/Range 各 40ms 桩延迟），故用轮询等「卡片出来且已量到大小」再快照；
      // 快照必须在 11000ms 的报告采集**之前**完成，故最多再等 6s。
      setTimeout(() => {
        window.__clickedSniff = clickByText('图片嗅探');
        const poll = (tries, stage) => {
          const m = Array.from(document.querySelectorAll('.ant-modal')).find((el) =>
            ((el.querySelector('.ant-modal-title') || {}).textContent || '').includes('图片嗅探')
          );
          const t = m ? m.textContent || '' : '';
          // ⚠️ 「来源」是卡片下方的 title（hover 提示）而不是可见文本：SniffModal 的 metaOf()
          //    只把它写进 title 属性，故 DOM 断言必须把 title 一并纳入匹配面（v26.10.10-v4 踩过）。
          const titles = m
            ? Array.from(m.querySelectorAll('[title]'))
                .map((el) => el.getAttribute('title') || '')
                .join(' | ')
            : '';
          const hay = t + ' || ' + titles;
          const cards = m ? m.querySelectorAll('.ant-image').length : 0;
          const unknown = /大小未知（(\d+)）/.exec(t);
          const excludedNotice = /已按文件名排除\s*(\d+)\s*张/.exec(t);
          // 全选后的按钮文案「下载所选（N）」= 全选范围（v26.10.10-v6 起必须等于「卡片 + 大小未知」）
          const dlBtn = m
            ? Array.from(m.querySelectorAll('.ant-modal-footer button')).find(
                (b) => ((b.textContent || '').indexOf('下载所选') >= 0)
              )
            : null;
          const dlText = dlBtn ? dlBtn.textContent || '' : '';
          const dlCount = /下载所选（(\d+)）/.exec(dlText);
          const btns = document.querySelectorAll('#__znhd_panel_host__ .znhd-panel-btn');
          const snap = {
            entrySeen: !!window.__clickedSniff,
            panelBtns: btns.length,
            panelHasSniffLabel: collectText().indexOf('图片嗅探') >= 0,
            modalSeen: !!m,
            cards: cards,
            sourcesCss: hay.indexOf('CSS 背景') >= 0,
            sourcesSvg: hay.indexOf('内联 SVG') >= 0,
            titlesSample: titles.slice(0, 300),
            headSize: t.indexOf('30 KB') >= 0,
            rangeSize: t.indexOf('40 KB') >= 0,
            unknownCount: unknown ? Number(unknown[1]) : -1,
            // v26.10.10-v6：界面不再出现「另有 N 张小于阈值」这类计数
            belowNoticeShown: t.indexOf('小于阈值') >= 0,
            // 10 KB 的 ⑦ 被阈值过滤 ⇒ 它不该出现在任何卡片标题里
            smallInTitles: titles.indexOf('sniff-small.png') >= 0,
            selectAllClicked: !!window.__sniffSelectAllClicked,
            selectAllLabel: dlText,
            selectAllCount: dlCount ? Number(dlCount[1]) : -1,
            excludedCount: excludedNotice ? Number(excludedNotice[1]) : -1,
            // 只看**卡片标题**（文件名 / 来源提示），不看弹窗正文：排除提示里本身就含这些字样
            excludedNameInTitles: /znhd-sniff|user-man|user-woman/.test(titles),
            // v26.10.10-v7：SVG 一律不进面板 —— 后缀规则要同时挡住「URL 就是 .svg」与「内联 SVG」两路
            svgUrlInTitles: titles.indexOf('icon.svg') >= 0,
            svgInTitles: /\.svg/i.test(titles),
          };
          // v26.10.10-v7 起 SVG 全被后缀规则排除，达标卡片只剩「CSS 背景 ×2」
          const done = snap.modalSeen && cards >= 2 && snap.headSize && snap.rangeSize;
          // 第一阶段：等扫描/测量完成；第二阶段：点「全选」后重取快照，看「下载所选（N）」的范围
          if (done && stage === 0 && m) {
            const box = Array.from(m.querySelectorAll('.ant-checkbox-wrapper')).find(
              (el) => ((el.textContent || '').indexOf('全选') >= 0)
            );
            const input = box ? box.querySelector('input') : null;
            if (input) input.click();
            window.__sniffSelectAllClicked = !!input;
            setTimeout(() => poll(Math.max(tries - 1, 1), 1), 250);
            return;
          }
          if ((done && stage === 1) || tries <= 0) {
            window.__sniffSnap = snap;
            return;
          }
          setTimeout(() => poll(tries - 1, stage), 200);
        };
        poll(30, 0);
      }, 9700);

      // ===== Agent 助手（v26.10.10-v10）=====
      // 前置：CAT.agent 桩（见本文件「ScriptCat Agent 桩」）。
      // 覆盖链路：面板第二行的 Agent 入口 → 弹窗（可用态）→ 三个页签切换 → 发消息 → 流式回答落地。
      // ⚠️ 发消息会真的走 streamConversation：分片是桩造的（thinking_delta → content_delta → done）。
      setTimeout(() => {
        const findAgentModal = () =>
          Array.from(document.querySelectorAll('.ant-modal')).find((el) =>
            ((el.querySelector('.ant-modal-title') || {}).textContent || '').includes('Agent 助手')
          );
        const clickBtnWithText = (root, text) => {
          const btn = Array.from(root.querySelectorAll('button')).find(
            (b) => (b.textContent || '').indexOf(text) >= 0
          );
          if (btn) btn.click();
          return !!btn;
        };
        const race = (promise, ms) =>
          Promise.race([
            promise,
            new Promise((resolve) => setTimeout(() => resolve('__timeout__'), ms)),
          ]);

        const snap = {
          entrySeen: false,
          panelFellBack: false,
          modalSeen: false,
          tabsOk: false,
          skillsPanelSeen: false,
          skillsListed: false,
          tasksPanelSeen: false,
          createOptions: null,
          sendClicked: false,
          userMsgSeen: false,
          replySeen: false,
          errorSeen: false,
          calls: [],
          // 「对话过后关弹窗再打开」回归（v26.10.10-v11）
          reopenEntryClicked: false,
          reopenModalSeen: false,
          reopenHistorySeen: false,
          panelAliveAfterReopen: false,
          panelStateAfterReopen: null,
          reopenReactChildErrors: [],
          // 「会话索引 + 多会话切换」回归（v26.10.10-v12）
          chatsStored: null,
          newChatClicked: false,
          firstChatCleared: false,
          sendClicked2: false,
          secondUserMsgSeen: false,
          secondReplySeen: false,
          switchedToFirst: false,
          switchSelectCount: 0,
          switchOptionCount: 0,
          switchOptionTexts: [],
          switchHistorySeen: false,
          switchSecondGone: false,
          switchHistoryThinkingSeen: false,
          panelAliveAfterSwitch: false,
          panelStateAfterSwitch: null,
          chatsStoredAfterSwitch: null,
        };
        window.__agentSnap = snap;

        const clickEntry = () => {
          const host = document.getElementById('__znhd_panel_host__');
          if (!host) return false;
          const btn = Array.from(host.querySelectorAll('button')).find(
            (b) => (b.textContent || '').indexOf('Agent') >= 0
          );
          if (!btn) return false;
          btn.click();
          return true;
        };

        const stageSkills = (tries) => {
          const m = findAgentModal();
          if (!m) {
            if (tries > 0) setTimeout(() => stageSkills(tries - 1), 75);
            else {
              snap.stageReached = 'skills-no-modal';
              finish();
            }
            return;
          }
          snap.tabsOk = clickBtnWithText(m, '技能');
          setTimeout(() => {
            if (!snap.tabsOk) {
              snap.stageReached = 'tab-skills-miss';
              finish();
              return;
            }
            snap.skillsPanelSeen = (m.textContent || '').indexOf('已安装') >= 0;
            snap.skillsListed = (m.textContent || '').indexOf('stub-skill') >= 0;
            clickBtnWithText(m, '定时任务');
            setTimeout(() => {
              snap.tasksPanelSeen = (m.textContent || '').indexOf('crontab') >= 0;
              clickBtnWithText(m, '对话');
              setTimeout(() => stageSend(0), 300);
            }, 300);
          }, 300);
        };

        // 用原型上的 setter 赋值再派发 input：React 的受控输入依赖原生 setter 触发的 value 跟踪
        // （直接 `ta.value = x` 会被 React 缓存的 value 覆盖掉；input 事件必须冒泡到 root）
        const typeMessage = (text) => {
          const m = findAgentModal();
          const ta = m ? m.querySelector('textarea') : null;
          if (!ta) return null;
          const setter = Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, 'value').set;
          setter.call(ta, text);
          ta.dispatchEvent(new Event('input', { bubbles: true }));
          return ta;
        };

        const stageSend = (tries) => {
          const m = findAgentModal();
          if (!m) {
            if (tries > 0) {
              setTimeout(() => stageSend(tries - 1), 100);
              return;
            }
            snap.stageReached = 'send-no-modal';
            finish();
            return;
          }
          const ta = m.querySelector('textarea');
          snap.taFound = !!ta;
          if (!ta) {
            if (tries > 0) {
              setTimeout(() => stageSend(tries - 1), 100);
              return;
            }
            snap.stageReached = 'send-no-textarea';
            finish();
            return;
          }
          typeMessage('你好');
          snap.taValue = ta.value;
          snap.stageReached = 'send';
          snap.sendButtons = Array.from(m.querySelectorAll('button'))
            .map((b) => (b.textContent || '').trim())
            .filter(Boolean);
          snap.sendClicked = clickBtnWithText(m, '发送');
          setTimeout(() => stageReply(35), 250);
        };

        const stageReply = (tries) => {
          const m = findAgentModal();
          const t = m ? m.textContent || '' : '';
          snap.userMsgSeen = t.indexOf('你好') >= 0;
          snap.replySeen = t.indexOf('（桩回答）') >= 0;
          snap.thinkingSeen = t.indexOf('先想一下') >= 0;
          // 助手气泡的错误态直接查类名，并把错误原文带进快照（失败时不必再猜）
          const errEl = m ? m.querySelector('.znhd-agent-msg-error') : null;
          snap.errorSeen = !!errEl;
          snap.errorText = errEl ? (errEl.textContent || '').slice(0, 200) : '';
          snap.calls = (window.__catAgentCalls || []).slice();
          snap.replyTries = tries;
          if (snap.replySeen && snap.userMsgSeen) {
            snap.stageReached = 'reply-seen';
            closeAndReopen();
            return;
          }
          if (tries <= 0) {
            snap.stageReached = 'reply-timeout';
            finish();
            return;
          }
          setTimeout(() => stageReply(tries - 1), 100);
        };

        /* ===== 回归用例（v26.10.10-v11）：对话过后关闭弹窗再打开 =====================
           背景：历史消息里的 `thinking` 是**对象**（官方 ThinkingBlock = { content }），
           而流式对话时是字符串。若把对象直接交给 React 渲染，会抛
           `Objects are not valid as a React child (found: object with keys {content})`；
           面板没有错误边界 ⇒ 整棵面板树被卸载，宿主 div 还在、自愈也救不回来，
           表现为「主面板整个消失」。所以这条用例的判据不是「弹窗能开」，而是
           **面板本体仍在**（容器有高度、收起按钮与 Agent 入口都还在）+ 历史思考文本已渲染。 */
        const panelState = () => {
          const host = document.getElementById('__znhd_panel_host__');
          if (!host) return { alive: false, buttons: 0, height: 0 };
          const buttons = Array.from(host.querySelectorAll('button'));
          return {
            alive: true,
            buttons: buttons.length,
            height: Math.round(host.getBoundingClientRect().height),
            hasCollapse: !!host.querySelector('button[aria-label="收起面板"]'),
            hasAgentEntry: buttons.some((b) => (b.textContent || '').indexOf('Agent') >= 0),
          };
        };

        const closeAndReopen = () => {
          const m = findAgentModal();
          if (m) clickBtnWithText(m, '关闭');
          setTimeout(() => waitModalGone(25), 150);
        };

        const waitModalGone = (tries) => {
          if (!findAgentModal()) {
            snap.reopenEntryClicked = clickEntry();
            setTimeout(() => waitModalBack(30), 250);
            return;
          }
          if (tries <= 0) {
            snap.stageReached = 'reopen-close-timeout';
            finish();
            return;
          }
          setTimeout(() => waitModalGone(tries - 1), 100);
        };

        const waitModalBack = (tries) => {
          if (findAgentModal()) {
            snap.reopenModalSeen = true;
            // 等历史回填 effect 跑完并渲染（崩溃就发生在这两拍之间）
            setTimeout(checkReopen, 250);
            return;
          }
          if (tries <= 0) {
            snap.stageReached = 'reopen-no-modal';
            finish();
            return;
          }
          setTimeout(() => waitModalBack(tries - 1), 100);
        };

        const checkReopen = () => {
          const state = panelState();
          snap.panelStateAfterReopen = state;
          snap.panelAliveAfterReopen = !!(
            state.alive &&
            state.height > 0 &&
            state.hasCollapse &&
            state.hasAgentEntry
          );
          const m = findAgentModal();
          const t = m ? m.textContent || '' : '';
          // 历史里的思考文本只可能来自 getMessages() 回填（流式那条是「先想一下」）
          snap.reopenHistorySeen = t.indexOf('（桩）历史思考') >= 0;
          snap.reopenReactChildErrors = (window.__errors || [])
            .filter((e) => /React child|not valid as a React child/i.test(e))
            .slice(0, 2);
          snap.stageReached = 'reopen-checked';
          // 接着验证 v26.10.10-v12 的多会话：新建 → 切换回上一个
          stageNewChat(30);
        };

        /* ===== 回归用例（v26.10.10-v12）：会话索引持久化 + 多会话切换 =============
           官方 CAT.agent.conversation 只开放 create/get（没有 list/delete），所以「会话列表」
           是脚本自己记在 localStorage 的 scriptCat_AgentChats 里的。这条用例覆盖：
           ① 发完一轮后索引里就有这个对话（id + 用首条消息当标题）
           ② 点「新建对话」再发一条 → 第二个对话进索引，视图里看不到上一个对话的内容
           ③ 用顶部下拉切回第一个对话 → 又看到它自己的历史（含对象形状 thinking 的回填），面板仍在 */
        const readChatStore = () => {
          try {
            return JSON.parse(localStorage.getItem('scriptCat_AgentChats') || 'null');
          } catch (e) {
            return { parseError: String((e && e.message) || e) };
          }
        };

        const stageNewChat = (tries) => {
          const m = findAgentModal();
          if (!m) {
            snap.stageReached = 'v12-no-modal';
            finish();
            return;
          }
          snap.chatsStored = readChatStore();
          snap.newChatClicked = clickBtnWithText(m, '新建对话');
          if (!snap.newChatClicked && tries > 0) {
            setTimeout(() => stageNewChat(tries - 1), 100);
            return;
          }
          setTimeout(() => {
            const text = (findAgentModal() || {}).textContent || '';
            // 「新建对话」只是把视图清空、下次发送时才真正 create（不留空会话）
            snap.firstChatCleared = text.indexOf('你好') < 0;
            const ta = typeMessage('第二个问题');
            snap.taFound2 = !!ta;
            snap.sendClicked2 = clickBtnWithText(findAgentModal(), '发送');
            setTimeout(() => stageSecondReply(35), 250);
          }, 300);
        };

        const stageSecondReply = (tries) => {
          const m = findAgentModal();
          const t = m ? m.textContent || '' : '';
          snap.secondUserMsgSeen = t.indexOf('第二个问题') >= 0;
          snap.secondReplySeen = t.indexOf('（桩回答）') >= 0;
          snap.chatsStored = readChatStore();
          if (snap.secondUserMsgSeen && snap.secondReplySeen) {
            snap.stageReached = 'second-reply-seen';
            stageSwitchBack(30);
            return;
          }
          if (tries <= 0) {
            snap.stageReached = 'second-reply-timeout';
            finish();
            return;
          }
          setTimeout(() => stageSecondReply(tries - 1), 100);
        };

        // 切换会话：antd Select 靠 mousedown 打开下拉，选项渲染在 body 下的浮层里
        const stageSwitchBack = (tries) => {
          const m = findAgentModal();
          if (!m) {
            snap.stageReached = 'switch-no-modal';
            finish();
            return;
          }
          const selects = Array.from(m.querySelectorAll('.ant-select'));
          snap.switchSelectCount = selects.length;
          // 第 1 个是模型下拉，第 2 个是会话下拉
          const target = selects[1];
          if (!target) {
            if (tries > 0) {
              setTimeout(() => stageSwitchBack(tries - 1), 100);
              return;
            }
            snap.stageReached = 'switch-no-select';
            finish();
            return;
          }
          const selector = target.querySelector('.ant-select-selector') || target;
          selector.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, cancelable: true }));
          setTimeout(() => openChatOption(tries), 200);
        };

        const openChatOption = (tries) => {
          const options = Array.from(document.querySelectorAll('.ant-select-item-option'));
          snap.switchOptionCount = options.length;
          snap.switchOptionTexts = options.map((el) => (el.textContent || '').trim()).slice(0, 6);
          // 第一个对话在列表里的名字就是它的第一条消息
          const option = options.find((el) => (el.textContent || '').trim() === '你好');
          if (option) {
            snap.stageReached = 'switch-option-clicked';
            option.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, cancelable: true }));
            option.click();
            setTimeout(checkSwitch, 400);
            return;
          }
          if (tries <= 0) {
            snap.stageReached = 'switch-no-option';
            finish();
            return;
          }
          setTimeout(() => openChatOption(tries - 1), 150);
        };

        const checkSwitch = () => {
          const m = findAgentModal();
          const t = m ? m.textContent || '' : '';
          snap.switchedToFirst = !!m;
          snap.switchHistorySeen = t.indexOf('你好') >= 0;
          // 少了这条，用例可能只是「没换视图」也判过
          snap.switchSecondGone = t.indexOf('第二个问题') < 0;
          // 只有切回第一个对话并重新回填历史，才会出现 getMessages() 里的思考文本
          snap.switchHistoryThinkingSeen = t.indexOf('（桩）历史思考') >= 0;
          const state = panelState();
          snap.panelStateAfterSwitch = state;
          snap.panelAliveAfterSwitch = !!(
            state.alive &&
            state.height > 0 &&
            state.hasCollapse &&
            state.hasAgentEntry
          );
          snap.chatsStoredAfterSwitch = readChatStore();
          snap.stageReached = 'switch-checked';
          finish();
        };

        const finish = () => {
          snap.calls = (window.__catAgentCalls || []).slice();
          snap.createOptions = window.__catAgentCreateOptions || null;
          const host = document.getElementById('__znhd_panel_host__');
          if (host) {
            const rows = {};
            Array.from(host.querySelectorAll('button')).forEach((b) => {
              const label = (b.textContent || '').trim().split(/\s+/)[0];
              rows[label] = Math.round(b.getBoundingClientRect().top);
            });
            snap.rows = rows;
          }
        };

        snap.entrySeen = clickEntry();
        if (!snap.entrySeen) {
          // 入口都没点到：记录面板退出按钮是否存在，便于区分「没渲染」与「点击没生效」
          const host = document.getElementById('__znhd_panel_host__');
          snap.panelFellBack = !!host;
          finish();
          return;
        }
        setTimeout(() => {
          snap.modalSeen = !!findAgentModal();
          if (!snap.modalSeen) {
            finish();
            return;
          }
          stageSkills(30);
        }, 450);
      }, 7300);

      // 打开「运行日志」弹窗：验证「日志从上到下生成、最新在最上方」（v26.10.06-v23 需求）。
      // 放在 10600ms（报告在 11000ms 采集），留 400ms 给 React 渲染。
      setTimeout(() => {
        window.__openedLog = clickByText('查看日志');
      }, 10600);

      setTimeout(() => {
        const text = collectText();
        const relevant = window.__errors.filter((e) => !/chrome-extension:/.test(e));
        // v26.10.06-v13 起更新日志也是 antd Modal（不再是自拼 DOM 的 #__znhd_changelog_popup__）
        const popup = Array.from(document.querySelectorAll('.ant-modal')).find(
          (m) => (m.textContent || '').indexOf('更新日志') >= 0
        );
        const report = {
          CAT_UI: typeof window.CAT_UI,
          jsyaml: typeof window.jsyaml,
          QRCode: typeof window.QRCode,
          Viewer: typeof window.Viewer,
          recvResponses: window.__recvCount || 0,

            window.__historyTabs &&
            window.__historyTabs.length === 2 &&
            window.__historyTabs[0].indexOf('图片') >= 0 &&
            window.__historyTabs[1].indexOf('文本') >= 0
          ),
          historyTextOk: !!window.__historyText,
          // 「发送测试图片」+「历史为空也能打开」（v26.10.08-v10）
          //   ① 弹窗**标题栏**里必须有「发送测试图片」按钮；
          //   ② 点它之后，代码确实把图片 base64 POST 到了 /u/<deviceId>（= 手机上传同一条路径）；
          //   ③ 两个页签都清空后，再点面板入口**仍能打开**（旧实现会在这一步只弹提示、不开窗）。
          testImageBtnOk: (() => {
            const m = Array.from(document.querySelectorAll('.ant-modal')).find((el) =>
              ((el.querySelector('.ant-modal-title') || {}).textContent || '').includes('历史记录')
            );
            if (!m) return false;
            const title = m.querySelector('.ant-modal-title');
            return Array.from(title ? title.querySelectorAll('button') : []).some((b) =>
              (b.textContent || '').includes('发送测试图片')
            );
          })(),
          testImageSentOk: !!(
            window.__testImageSent &&
            typeof window.__testImageSent.data === 'string' &&
            window.__testImageSent.data.length > 100 &&
            /^image\//.test(window.__testImageSent.mime || '')
          ),
          historyEmptyOpenOk: (() => {
            const m = Array.from(document.querySelectorAll('.ant-modal')).find((el) =>
              ((el.querySelector('.ant-modal-title') || {}).textContent || '').includes('历史记录')
            );
            const t = m ? m.textContent || '' : '';
            return t.includes('图片（0）') && t.includes('文本（0）');
          })(),
          // 已连接手机（v26.10.06-v4）：设备互联弹窗要显示**数量**与**手机 ID 列表**，
          // 且 ≥2 台时要有常驻多选（默认全选）。
          phoneCountOk: (() => {
            const m = Array.from(document.querySelectorAll('.ant-modal')).find((el) =>
              (el.textContent || '').includes('手机互传')
            );
            return !!m && (m.textContent || '').includes('已连接手机 2 台');
          })(),
          phoneListOk: (() => {
            const m = Array.from(document.querySelectorAll('.ant-modal')).find((el) =>
              (el.textContent || '').includes('手机互传')
            );
            const t = m ? m.textContent || '' : '';
            return t.includes('11111111') && t.includes('22222222');
          })(),
          phoneMultiPickOk: (() => {
            const m = Array.from(document.querySelectorAll('.ant-modal')).find((el) =>
              (el.textContent || '').includes('手机互传')
            );
            if (!m) return false;
            // 两台手机 => 常驻多选，且默认全选（两个复选框都是选中态）
            const boxes = Array.from(m.querySelectorAll('.ant-checkbox-input'));
            return boxes.length === 2 && boxes.every((b) => b.checked);
          })(),
          // 设备 ID 的彩色标签（v26.10.08-v12）：每个 ID 都要有**实边框**和**不透明底色**，
          // 且两个不同 ID 的底色必须**不一样**（用户要求「不同设备 ID 不同底色」）。
          // ⚠️ 这条能抓到「哈希撞色」：本功能第一版用 `h*31+c` 时两个模拟 ID 就撞成同色了。
          phoneIdColorOk: (() => {
            const m = Array.from(document.querySelectorAll('.ant-modal')).find((el) =>
              (el.textContent || '').includes('手机互传')
            );
            if (!m) return false;
            const tags = Array.from(m.querySelectorAll('[data-device-id]'));
            if (tags.length < 2) return false;
            const styles = tags.map((t) => {
              const cs = getComputedStyle(t);
              return { bg: cs.backgroundColor, borderW: parseFloat(cs.borderTopWidth) || 0 };
            });
            const allHaveBorderAndBg = styles.every((s) => s.borderW > 0 && s.bg && s.bg !== 'rgba(0, 0, 0, 0)');
            const distinctBg = new Set(styles.map((s) => s.bg)).size === styles.length;
            return allHaveBorderAndBg && distinctBg;
          })(),
          // 预览打开时只能有**一层**遮罩（v26.10.08-v9）：
          // 预览是全屏浮层，底下那层弹窗遮罩完全被盖住却仍会把画面再压暗一层
          // （两层 rgba(0,0,0,0.45) 合成 0.6975，白底灰度 77；单层是 140 —— 用户反馈的「没官方明亮」）。
          // 兼容 v6/v5：这里只认「历史记录」弹窗自己那个 modal-root 的遮罩是否已撤掉。
          // ⚠️ v26.10.08-v10：同样取 8000ms 的快照。
          previewSingleMaskOk: !!(window.__snap && window.__snap.singleMask),
          // 发送到手机：必须先压缩再发（v26.10.06-v6 回归断言）。判定要点：
          // 实际 POST 的字节是 JPEG、最长边 ≤1600（压缩上限）、且比原图小。
          phoneSendCheck: window.__phoneSendCheck || null,
          phoneSendCompressedOk: !!(
            window.__phoneSendCheck &&
            window.__phoneSendCheck.got &&
            window.__phoneSendCheck.jpegMagic &&
            Math.max(window.__phoneSendCheck.w || 0, window.__phoneSendCheck.h || 0) <= 1600 &&
            window.__phoneSendCheck.bytes < (window.__phoneSendCheck.originalBytes || Infinity)
          ),
          xhr: window.__gmXhrLog.slice(0, 6),
          // ===== 样式隔离断言（v26.10.06-v11）=====
          // 宿主页面把 html/body 设成 text-align:center、且要求 content-box，
          // 面板/弹窗必须仍保持左对齐、盒模型正确 —— 否则就是隔离层失效（用户实测反馈过）。
          modalTextAlignLeft: (() => {
            const body = document.querySelector('.ant-modal-body');
            return !!body && getComputedStyle(body).textAlign === 'left';
          })(),
          // 图标必须与所在控件垂直居中（±2px）——守卫「第三方样式给 svg 加负 margin 把图标顶出控件」。
          // v26.10.06-v16 起 antd TimePicker 换回原生 input，原时钟图标已不存在，故改为量同类对象：
          // 输入框「清空 ×」→ 弹窗关闭图标 → 侧边栏关闭图标，取第一个存在且有高度的。
          iconVerticallyCentered: (() => {
            const pairs = [
              ['.ant-input-affix-wrapper', '.ant-input-clear-icon'],
              ['.ant-modal-close', '.ant-modal-close-x svg'],
              ['.ant-drawer-close', '.ant-drawer-close svg'],
            ];
            for (const pair of pairs) {
              const box = document.querySelector(pair[0]);
              const icon = document.querySelector(pair[1]);
              if (!box || !icon) continue;
              const a = box.getBoundingClientRect();
              const b = icon.getBoundingClientRect();
              if (!b.height) continue;
              return Math.abs(a.top + a.height / 2 - (b.top + b.height / 2)) <= 2;
            }
            return false;
          })(),
          // 图片嗅探（v26.10.10-v4）：入口 + 三路来源 + 整条尺寸阶梯 + 未知不丢 + 阈值过滤
          sniffEntryOk: !!(window.__sniffSnap && window.__sniffSnap.entrySeen && window.__sniffSnap.modalSeen),
          sniffScanOk: !!(
            window.__sniffSnap &&
            window.__sniffSnap.cards >= 2 &&
            window.__sniffSnap.sourcesCss &&
            window.__sniffSnap.headSize &&
            window.__sniffSnap.rangeSize &&
            // v26.10.10-v7：SVG 全被后缀规则挡在面板外，故这里反过来要求「面板里没有 SVG 来源」
            !window.__sniffSnap.sourcesSvg
          ),
          sniffUnknownKeptOk: !!(window.__sniffSnap && window.__sniffSnap.unknownCount >= 1),
          // 图片嗅探（v26.10.10-v6，用户反馈）：小于阈值的图不显示、不计数、也不进全选/批量下载范围。
          // 判据：① 面板不再出现「小于阈值」字样；② 10 KB 的 ⑦ 不在任何卡片标题里；
          // ③ 点「全选」后按钮文案的张数 === 已渲染卡片数 + 大小未知数（含被阈值过滤的那张就会多 1）。
          sniffSelectScopeOk: !!(
            window.__sniffSnap &&
            window.__sniffSnap.selectAllClicked &&
            !window.__sniffSnap.belowNoticeShown &&
            !window.__sniffSnap.smallInTitles &&
            window.__sniffSnap.selectAllCount ===
              window.__sniffSnap.cards + window.__sniffSnap.unknownCount &&
            window.__sniffSnap.selectAllCount >= 1
          ),
          // 图片嗅探（v26.10.10-v5）：名称排除——命中规则的图不进候选（连请求都不发），
          // 面板给出排除计数，且被排除的名字一个都不许出现在卡片标题里。
          sniffExcludeOk: !!(
            window.__sniffSnap &&
            window.__sniffSnap.excludedCount >= 2 &&
            !window.__sniffSnap.excludedNameInTitles
          ),
          // 后缀排除（v26.10.10-v7）：URL 是 .svg 的与内联 SVG 都不进面板。
          // excludedCount >= 4 = 名称规则那 3 张（data 大/小 + user-man）+ 至少 1 张 SVG。
          sniffSvgExcludedOk: !!(
            window.__sniffSnap &&
            !window.__sniffSnap.svgUrlInTitles &&
            !window.__sniffSnap.svgInTitles &&
            window.__sniffSnap.excludedCount >= 4
          ),
          // ===== Agent 助手（v26.10.10-v10）=====
          // 链路：面板第二行的 Agent 入口 → 弹窗 → 三个页签 → 发消息 → 流式回答。
          // ⚠️ 这些断言在 CAT.agent 桩下跑「可用态」；不可用态（无 CAT）由 buildAgentSnap 的
          //    panelFellBack/entrySeen 两条覆盖不了 —— 那条路径的判据是弹窗里的 Alert 文案，
          //    本 harness 不再单独造一份「无 CAT」环境（会与桩冲突）。
          agentEntryOk: !!(window.__agentSnap && window.__agentSnap.entrySeen && window.__agentSnap.modalSeen),
          agentTabsOk: !!(
            window.__agentSnap &&
            window.__agentSnap.tabsOk &&
            window.__agentSnap.skillsPanelSeen &&
            window.__agentSnap.skillsListed &&
            window.__agentSnap.tasksPanelSeen
          ),
          agentChatOk: !!(
            window.__agentSnap &&
            window.__agentSnap.sendClicked &&
            window.__agentSnap.userMsgSeen &&
            window.__agentSnap.replySeen &&
            !window.__agentSnap.errorSeen
          ),
          // v26.10.10-v11：对话过后关弹窗再打开 —— 历史 thinking 是对象，渲染不当会让整个面板消失
          agentReopenOk: !!(
            window.__agentSnap &&
            window.__agentSnap.reopenEntryClicked &&
            window.__agentSnap.reopenModalSeen &&
            window.__agentSnap.reopenHistorySeen &&
            window.__agentSnap.panelAliveAfterReopen
          ),
          // v26.10.10-v12：会话索引持久化 + 多会话切换（官方只有 create/get，列表是脚本自记的）
          agentChatsOk: (() => {
            const s = window.__agentSnap;
            if (!s) return false;
            const store = s.chatsStored;
            const items = (store && Array.isArray(store.items) && store.items) || [];
            const titles = items.map((i) => i && i.title);
            return !!(
              items.length >= 2 &&
              titles.indexOf('你好') >= 0 &&
              titles.indexOf('第二个问题') >= 0 &&
              s.newChatClicked &&
              s.firstChatCleared &&
              s.sendClicked2 &&
              s.secondUserMsgSeen &&
              s.secondReplySeen &&
              s.switchedToFirst &&
              s.switchHistorySeen &&
              s.switchSecondGone &&
              s.switchHistoryThinkingSeen &&
              s.panelAliveAfterSwitch
            );
          })(),
          agentSnap: window.__agentSnap || null,
          sniffSnap: window.__sniffSnap || null,
          relevantErrors: relevant,
        };
        document.getElementById('smoke-result').textContent = JSON.stringify(report, null, 2);
        document.title =
          'znhd-smoke:' +
          (report.panel &&
          report.overlayViewportSized &&
          report.panelIconsAreSvg &&
          report.textPopup &&
          report.galleryText &&
          report.phrasesLoaded &&
          report.changelogPopup &&
          report.viewerZoomOk &&
          report.copyOk &&
          report.printBtnOk &&
          report.printIframeOk &&
          report.printA4Ok &&
          report.previewToolbarOk &&
          report.previewIconCenteredOk &&
          report.previewSingleMaskOk &&
          report.historyTabsOk &&
          report.historyTextOk &&
          report.testImageBtnOk &&
          report.testImageSentOk &&
          report.historyEmptyOpenOk &&
          report.phoneCountOk &&
          report.phoneListOk &&
          report.phoneMultiPickOk &&
          report.phoneIdColorOk &&
          report.phoneSendCompressedOk &&
          report.sniffEntryOk &&
          report.sniffScanOk &&
          report.sniffUnknownKeptOk &&
          report.sniffExcludeOk &&
          report.sniffSvgExcludedOk &&
          report.sniffSelectScopeOk
            ? 'ALL-OK'
            : 'PARTIAL');
      }, 11000);
    </script>
  </body>
</html>
