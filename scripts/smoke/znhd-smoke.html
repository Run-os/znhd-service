<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>znhd 冒烟测试</title>

    <!-- ===== 模拟真实宿主页面的「敌意 CSS」=====
         本脚本的面板/弹窗是注入到**别人页面**里的：税务页有全局 text-align:center、
         非 border-box 盒模型、自定义 svg 对齐等规则，会污染 antd 组件外观
         （v26.10.06-v11 的「弹窗文字全居中 + 输入框图标偏移」就是这么来的）。
         这里常驻几条同类规则，作为样式隔离层（lib/ui/uiReset.ts + 弹窗 styles.body）的回归守卫。 -->
    <style>
      html,
      body {
        text-align: center; /* 旧代码靠显式 textAlign:'left' 守，去掉就会整屏居中 */
      }
      body * {
        box-sizing: content-box; /* 非 border-box，验证隔离层是否复位 */
      }
      /* 实测抓到的真凶：某第三方样式给 svg 加了负上边距（用户环境里时钟图标的
         margin: -2.75em auto 0 ≈ -44px），把 antd 图标整体顶出输入框。
         常驻这条规则，「时间图标与输入框同一水平线」断言才有牙齿。 */
      svg {
        margin: -2.75em auto 0;
      }
    </style>

    <!-- ===== GM API 桩（模拟油猴环境 + 按真实中继协议返回数据） ===== -->
    <script>
      // 先落一份干净的配置（脚本读 localStorage，不读 GM_getValue）
      localStorage.removeItem('scriptCat_PhrasesCache');
      localStorage.removeItem('scriptCat_PanelPoint');
      localStorage.setItem('scriptCat_Allvalue', JSON.stringify({ voiceEnabled: false, useCdn: true }));

      window.__gmXhrLog = [];
      const PNG_1x1 =
        'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==';
      // 收到图片的载荷：用 canvas 生成一张**真实尺寸**的 JPEG（480×360），而不是 1×1 占位 PNG。
      // 原因：断言里要校验「放大后主图有可见尺寸」（rect > 10px），而 1×1 的图 Viewer 只会渲染成 1px，
      // 该判定形同虚设（v26.10.8-v1 加断言时踩过：canvasImg/decoded 都 true，只有 visible 因 1px 为 false）。
      const SMOKE_IMG_B64 = (() => {
        try {
          const c = document.createElement('canvas');
          c.width = 480;
          c.height = 360;
          const ctx = c.getContext('2d');
          ctx.fillStyle = '#e6f2ff';
          ctx.fillRect(0, 0, 480, 360);
          for (let i = 0; i < 40; i++) {
            ctx.fillStyle = 'hsl(' + ((i * 37) % 360) + ',70%,55%)';
            ctx.fillRect((i * 53) % 420, (i * 97) % 300, 60, 50);
          }
          return c.toDataURL('image/jpeg', 0.8).split(',')[1];
        } catch (e) {
          return PNG_1x1; // canvas 不可用时退回占位图（可见尺寸断言会因此失败，属预期）
        }
      })();
      const PHRASES_YAML = ['冒烟常用语A: |', '  A 的内容', '冒烟常用语B: |', '  B 的内容', ''].join('\n');
      // 更新日志：给 12 条，验证「默认只显示最新 10 条」+ 条数提示（多出的 2 条不渲染）
      const CHANGELOG_MD = (() => {
        const parts = ['# 更新日志', '', '本文件是唯一来源。', '', '---', ''];
        for (let i = 1; i <= 12; i++) {
          parts.push('### znhd.user.js v99.0.' + i + '-v1');
          parts.push('');
          parts.push(i === 1 ? '- 冒烟更新日志标记行' : '- 第 ' + i + ' 条日志内容');
          parts.push('');
        }
        return parts.join('\n');
      })();

      // 剪贴板写入桩：只**记录**每次 clipboard.write 的条目类型并直接拒绝。
      // 这样无需真实剪贴板权限即可断言「代码有没有先拿不支持的 jpeg 去试」——
      // headless 里图片剪贴板根本写不进去（实测即使只写一次 image/png 也会被拒），
      // 所以断言只能锁「尝试的类型」这个不变量，不能锁「写成功」。
      window.__copyWriteTypes = [];
      try {
        if (typeof Clipboard !== 'undefined' && Clipboard.prototype && Clipboard.prototype.write) {
          Clipboard.prototype.write = function (items) {
            window.__copyWriteTypes.push(Array.prototype.map.call(items, (i) => i.types));
            return Promise.reject(new DOMException('smoke-stub: 桩环境不支持写剪贴板', 'NotAllowedError'));
          };
        }
      } catch (e) {
        /* 忽略：环境没有 Clipboard 时断言会因「零次调用」而失败，属预期 */
      }

      // 打印（v26.10.08-v1）：react-to-print 会往 body 挂一个 id=printWindow 的隐藏 iframe。
      // ⚠️ headless 里没有打印对话框，且桌面 UA 下打印完成后 iframe 会被立刻移除，
      //    所以不能用「iframe 还在不在」判断，必须用 MutationObserver 在**插入那一刻**记录。
      // 该 iframe 只在「找到了打印内容节点」时才会被挂上（react-to-print 拿不到内容会直接 return），
      // 因此它出现 = 「按钮 → printImage → doPrint」整条链路真的接通了。
      window.__printIframeSeen = false;
      try {
        new MutationObserver((muts) => {
          muts.forEach((m) =>
            Array.prototype.forEach.call(m.addedNodes, (n) => {
              if (n && n.id === 'printWindow') window.__printIframeSeen = true;
            })
          );
        }).observe(document.documentElement, { childList: true, subtree: true });
      } catch (e) {
        /* 忽略：不支持 MutationObserver 时断言会因「从未见到 iframe」而失败，属预期 */
      }

      const reply = (details, payload) => {
        setTimeout(() => {
          if (typeof details.onload === 'function') {
            details.onload({
              status: 200,
              statusText: 'OK',
              responseText: typeof payload === 'string' ? payload : JSON.stringify(payload),
              responseHeaders: '',
              finalUrl: details.url,
            });
          }
        }, 40);
      };

      window.GM_info = {
        // 由 run.js 从构建产物的 ==UserScript== 头读出真实 @version 注入（evaluateOnNewDocument），
        // 这样「面板渲染的版本号」才是对产物的真实校验，而不是桩里的死值
        script: { version: window.__scriptVersion || '0.0.0-v0' },
        scriptHandler: 'smoke-harness',
        scriptUpdateURL: 'https://example.invalid/znhd.user.js',
        scriptWillUpdate: false,
      };
      window.unsafeWindow = window;
      window.GM_getValue = (k, d) => (k in (window.__store || {}) ? window.__store[k] : d);
      window.GM_setValue = (k, v) => {
        window.__store = window.__store || {};
        window.__store[k] = v;
      };
      window.GM_addStyle = (css) => {
        const s = document.createElement('style');
        s.textContent = css;
        document.head.appendChild(s);
        return s;
      };
      window.GM_setClipboard = () => {};
      window.GM_getResourceText = () => '';
      window.GM_notification = () => {};
      window.GM_addValueChangeListener = () => {};

      window.GM_xmlhttpRequest = (details) => {
        const url = String((details && details.url) || '');
        window.__gmXhrLog.push(((details && details.method) || 'GET') + ' ' + url);

        // 常用语 YAML：走成功路径
        if (url.includes('commonPhrases.yaml')) {
          reply(details, PHRASES_YAML);
          return { abort: () => {} };
        }
        // 更新日志 CHANGELOG.md：走成功路径
        if (url.includes('CHANGELOG.md')) {
          reply(details, CHANGELOG_MD);
          return { abort: () => {} };
        }
        // 手机在线状态：在线（「发送到手机」相关断言需要抽屉里的按钮可用）
        if (/\/phone\/status\//.test(url)) {
          reply(details, { online: true });
          return { abort: () => {} };
        }
        // 发送到手机：记录实际 POST 的载荷，用于校验「先压缩再发」（v26.10.06-v6 回归断言）
        if (/\/phone\/send\//.test(url)) {
          try {
            window.__phoneSent = window.__phoneSent || [];
            window.__phoneSent.push(JSON.parse((details && details.data) || '{}'));
          } catch (e) {
            window.__phoneSendErr = String((e && e.message) || e);
          }
          reply(details, { ok: true });
          return { abort: () => {} };
        }
        // 中继收件长轮询：先空响应确认连接，再给一条文本、一张图片，之后空转
        if (/\/recv\//.test(url)) {
          const n = (window.__recvCount = (window.__recvCount || 0) + 1);
          if (n === 1) reply(details, { empty: true });
          else if (n === 2)
            reply(details, { type: 'text', text: '冒烟测试文本：收到一条文本消息', ts: Date.now() });
          else if (n === 3)
            reply(details, {
              type: 'image',
              name: 'smoke.jpg',
              mime: 'image/jpeg',
              data: SMOKE_IMG_B64,
              ts: Date.now(),
            });
          else reply(details, { empty: true });
          return { abort: () => {} };
        }
        // 其它一律失败，观察脚本是否优雅降级
        setTimeout(() => {
          if (details && typeof details.onerror === 'function') {
            details.onerror({ status: 0, statusText: 'smoke-harness-blocked' });
          }
        }, 40);
        return { abort: () => {} };
      };
    </script>

    <!-- ===== 与 userscript @require 完全相同的依赖 =====
         v26.10.06-v9：CAT_UI（脚本猫 UI 库）已移除，面板改为 React 19 + Ant Design v6（随产物打包）。
         v26.10.06-v13：Viewer.js 也已移除——收图放大改用 antd Image.PreviewGroup，故此处不再加载它。 -->
    <script src="https://fastly.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="https://fastly.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://fastly.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.js"></script>
  </head>
  <body>
    <h1>znhd 面板冒烟测试</h1>
    <p>模拟 example.com 调试宿主：脚本会在本页注入浮动面板，并由 GM 桩按真实协议投递文本/图片。</p>

    <!-- 人数监控取 .count:nth-child(2)：本题为 body 的第 2 个子节点 -->
    <div class="count"><span>等待人数</span><span>0</span></div>

    <pre id="smoke-result" style="margin-top: 40px">running…</pre>

    <script>
      window.__errors = [];
      window.addEventListener('error', (e) =>
        window.__errors.push('error: ' + (e.message || e.type) + ' @ ' + (e.filename || '-') + ':' + (e.lineno || '-'))
      );
      window.addEventListener('unhandledrejection', (e) => {
        const r = e.reason;
        window.__errors.push('unhandledrejection: ' + ((r && (r.stack || r.message)) || String(r)));
      });
    </script>

    <!-- ===== 被测对象：构建产物 ===== -->
    <script src="/znhd.user.js"></script>

    <script>
      // CAT_UI 把面板挂在 Shadow DOM 里，必须穿透 shadowRoot 才能读到文本；
      // 弹窗（画廊/文本）挂在 documentElement 下，故用 documentElement.textContent 兜底。
      // CAT_UI 把面板挂在 Shadow DOM 里，必须穿透 shadowRoot 才能读到文本
      const collectShadowText = () => {
        let text = '';
        const walk = (root) => {
          root.querySelectorAll('*').forEach((el) => {
            if (el.shadowRoot) {
              text += '\n' + (el.shadowRoot.textContent || '');
              walk(el.shadowRoot);
            }
          });
        };
        walk(document);
        return text;
      };
      // 全页文本：Shadow DOM + documentElement（弹窗挂在 documentElement 下）
      const collectText = () =>
        (document.documentElement.innerText || '') +
        '\n' +
        (document.documentElement.textContent || '') +
        '\n' +
        collectShadowText();

      // 自动打开「常用语」抽屉，验证远程 YAML 成功路径
      // ⚠️ 用「包含」而非精确相等：面板按钮现在带 emoji 前缀（如「⚙️ 设置」「💬 常用语」），
      //    精确匹配会全部点不中（v26.10.06-v9 改制后踩过）。
      const clickByText = (label) => {
        let hit = null;
        const walk = (root) => {
          root.querySelectorAll('*').forEach((el) => {
            if (hit) return;
            if (el.shadowRoot) walk(el.shadowRoot);
            if (!hit && (el.tagName === 'BUTTON' || el.tagName === 'A') && (el.textContent || '').indexOf(label) >= 0) hit = el;
          });
        };
        walk(document);
        if (hit) hit.click();
        return !!hit;
      };

      // 影子 DOM 感知的元素查找（抽屉可能渲染在 shadow root 内，document.querySelectorAll 穿不透）
      const deepQuery = (pred) => {
        let hit = null;
        const walk = (root) => {
          root.querySelectorAll('*').forEach((el) => {
            if (hit) return;
            if (el.shadowRoot) walk(el.shadowRoot);
            if (!hit && pred(el)) hit = el;
          });
        };
        walk(document);
        return hit;
      };

      // 造一张 3000x2000 的大图（最长边远超压缩上限 1600），用于验证「发送到手机」会先压缩
      const makeBigFile = () =>
        new Promise((res) => {
          const cv = document.createElement('canvas');
          cv.width = 3000;
          cv.height = 2000;
          const ctx = cv.getContext('2d');
          ctx.fillStyle = '#1e7d5a';
          ctx.fillRect(0, 0, 3000, 2000);
          for (let i = 0; i < 200; i++) {
            ctx.fillStyle = 'hsl(' + (i * 5) + ',80%,50%)';
            ctx.fillRect((i * 137) % 3000, (i * 89) % 2000, 160, 120);
          }
          cv.toBlob((b) => res(new File([b], 'smoke-big.jpg', { type: 'image/jpeg' })), 'image/jpeg', 0.95);
        });

      setTimeout(() => {
        window.__clickedPhrases = clickByText('常用语');
      }, 3200);

      // ⚠️ 收到图片后点缩略图放大：必须断言「主图真的渲染出来」。
      // 历史：v26.10.8-v1 补的——此前只断言「九宫格画廊（缩略图出现）」，从没点过缩略图，
      // 导致「点开后只有黑罩、主图一直不出现」的 bug 存活了两个多月。
      // v26.10.06-v13 起画廊改为 antd Modal + Image.PreviewGroup，断言对象随之改为
      // `.ant-image-preview` / `.ant-image-preview-img`；判定要点不变：**已解码 + 有可见尺寸**。
      setTimeout(() => {
        // 收到图片后画廊弹窗会自动打开，点其中的 antd 缩略图触发放大预览
        const thumb = document.querySelector('.ant-modal-body .ant-image img');
        window.__clickedThumb = !!thumb;
        if (thumb) thumb.click();
      }, 3600);
      setTimeout(() => {
        const wrap = document.querySelector('.ant-image-preview');
        const img = wrap ? wrap.querySelector('.ant-image-preview-img') : null;
        const r = img ? img.getBoundingClientRect() : null;
        window.__viewerZoom = {
          container: !!wrap,
          shownClass: !!(wrap && (wrap.className || '').indexOf('ant-image-preview-open') >= 0),
          canvasImg: !!img,
          decoded: !!(img && img.complete && img.naturalWidth > 0),
          visible: !!(r && r.width > 10 && r.height > 10),
        };
      }, 4600);

      // 点画廊里的「复制」，验证剪贴板写入路径（v26.10.06-v4 回归断言）。
      // 用程序化 click 而非真实鼠标点击：此时放大预览/其它弹窗可能盖在画廊上（真实点击会打偏）。
      setTimeout(() => {
        const btns = Array.from(document.querySelectorAll('.ant-modal-body button'));
        const b = btns.find((x) => (x.textContent || '').trim() === '复制');
        window.__clickedCopy = !!b;
        if (b) b.click();
      }, 5200);

      // 点放大预览工具栏里的「打印」，验证 react-to-print 链路接通（v26.10.08-v2：入口从缩略图行挪到预览工具栏）。
      // 只断言「打印 iframe 被建出来」：headless 下看不到打印对话框，且该 iframe 打印后即被移除，
      // 故用 head 里装的 MutationObserver 记录（见 window.__printIframeSeen 的说明）。
      // 用轮询而不是固定时刻：预览在 3600ms 由缩略图点开，这里等它出现后再点，避免与其它弹窗的时序耦合。
      setTimeout(() => {
        const waitPrintBtn = (tries) => {
          const actions = document.querySelector('.ant-image-preview-actions');
          const b = actions ? actions.querySelector('button[aria-label="print"]') : null;
          if (b) {
            window.__printBtnSeen = true;
            // 位置断言：必须长在 antd 工具栏的胶囊容器「里面」（挪回缩略图行时这里会变红）
            window.__printBtnInActions = actions.contains(b) && !!b.querySelector('svg');
            b.click();
            return;
          }
          if (tries <= 0) {
            window.__printBtnSeen = false;
            window.__printBtnInActions = false;
            return;
          }
          setTimeout(() => waitPrintBtn(tries - 1), 200);
        };
        waitPrintBtn(25); // 最多再等 5s
      }, 4800);

      // 打开「设置」抽屉 → 点它里面的「更新日志」，验证新入口 + 弹窗 + 只显示最新 10 条
      setTimeout(() => {
        window.__clickedSettings = clickByText('设置');
      }, 4200);
      setTimeout(() => {
        window.__clickedChangelog = clickByText('[更新日志]');
      }, 5200);

      // 「发送到手机」：打开抽屉 → 选一张 3000x2000 大图 → 发送，断言实际 POST 出去的是压缩后的 JPEG。
      // 旧实现是 FileReader 直读原文件再 POST（原图直传），与「手机 → 电脑」的 canvas 压缩不对称：
      // 一张 3MB 照片就要上行 4MB（base64 +33%），且原图 ≥9MB 直接撞 12MB 单请求上限被拒。
      setTimeout(() => {
        window.__openedPhone = clickByText('设备互联');
      }, 6000);
      setTimeout(() => {
        const btn = deepQuery((el) => el.tagName === 'BUTTON' && (el.textContent || '').indexOf('选择 / 添加图片') >= 0);
        window.__clickedPick = !!btn;
        if (btn) btn.click();
      }, 6800);
      setTimeout(() => {
        const inp = document.querySelector('input[type=file]');
        if (!inp) {
          window.__pickErr = '未找到隐藏的 file input';
          return;
        }
        makeBigFile().then((f) => {
          window.__sentOriginalSize = f.size;
          const dt = new DataTransfer();
          dt.items.add(f);
          inp.files = dt.files;
          inp.dispatchEvent(new Event('change'));
          window.__injectedFile = true;
        });
      }, 7200);
      setTimeout(() => {
        // v26.10.06-v17：按钮文案按参考稿改为「发送 N 张图片」（原「发送 N 张图片到手机」），
        // 故用「张图片」匹配（唯一命中该按钮；选图按钮文案是「选择 / 添加图片」，不含「张图片」）
        const btn = deepQuery((el) => el.tagName === 'BUTTON' && (el.textContent || '').indexOf('张图片') >= 0);
        window.__clickedSendImg = !!btn;
        if (btn) btn.click();
      }, 9000);
      // 解出实际 POST 的字节：必须是 JPEG、最长边 ≤1600、且比原图小
      setTimeout(() => {
        const sent = (window.__phoneSent || [])[0];
        if (!sent || !sent.data) {
          window.__phoneSendCheck = { got: false, sentCount: (window.__phoneSent || []).length };
          return;
        }
        try {
          const bin = atob(sent.data);
          const arr = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
          const jpegMagic = arr[0] === 0xff && arr[1] === 0xd8;
          createImageBitmap(new Blob([arr], { type: sent.mime || 'image/jpeg' }))
            .then((bmp) => {
              window.__phoneSendCheck = {
                got: true,
                mime: sent.mime,
                name: sent.name,
                bytes: arr.length,
                originalBytes: window.__sentOriginalSize || 0,
                w: bmp.width,
                h: bmp.height,
                jpegMagic: jpegMagic,
              };
              bmp.close();
            })
            .catch((e) => {
              window.__phoneSendCheck = {
                got: true,
                mime: sent.mime,
                bytes: arr.length,
                decodeErr: String((e && e.message) || e),
              };
            });
        } catch (e) {
          window.__phoneSendCheck = { got: false, err: String((e && e.message) || e) };
        }
      }, 10300);

      // 打开「运行日志」弹窗：验证「日志从上到下生成、最新在最上方」（v26.10.06-v23 需求）。
      // 放在 10600ms（报告在 11000ms 采集），留 400ms 给 React 渲染。
      setTimeout(() => {
        window.__openedLog = clickByText('查看日志');
      }, 10600);

      setTimeout(() => {
        const text = collectText();
        const relevant = window.__errors.filter((e) => !/chrome-extension:/.test(e));
        // v26.10.06-v13 起更新日志也是 antd Modal（不再是自拼 DOM 的 #__znhd_changelog_popup__）
        const popup = Array.from(document.querySelectorAll('.ant-modal')).find(
          (m) => (m.textContent || '').indexOf('更新日志') >= 0
        );
        const report = {
          CAT_UI: typeof window.CAT_UI,
          jsyaml: typeof window.jsyaml,
          QRCode: typeof window.QRCode,
          Viewer: typeof window.Viewer,
          recvResponses: window.__recvCount || 0,
          // 运行日志排序（v26.10.07-v4 起改为「最新在底部」，反转了 v26.10.06-v23 的「最新在顶部」）：
          // 行结构为「时间戳 + 类型标签 + 消息」三栏，故用行类名 `.znhd-log-row` 与时间戳单元
          // `.znhd-log-ts` 定位（断言随被测对象一起升级，而不是删掉）。
          logListNotReversed: (() => {
            const rows = Array.from(document.querySelectorAll('.znhd-log-row'));
            if (rows.length < 2) return false;
            // 容器仍必须是 column：DOM 顺序 = 视觉顺序；「最新在底部」靠反转数组实现，不是 column-reverse
            return getComputedStyle(rows[0].parentElement).flexDirection !== 'column-reverse';
          })(),
          logNewestOnBottom: (() => {
            const rows = Array.from(document.querySelectorAll('.znhd-log-row'));
            if (rows.length < 2) return false;
            const t = (d) => {
              const s = d.querySelector('.znhd-log-ts');
              return s ? (s.textContent || '').trim() : '';
            };
            return t(rows[rows.length - 1]) >= t(rows[0]);
          })(),
          // 自动刷新开关（v26.10.07-v4）：日志弹窗底部状态栏里必须有这个 Switch，且默认开启
          logAutoRefreshToggle: (() => {
            const rows = Array.from(document.querySelectorAll('.znhd-log-row'));
            if (!rows.length) return false;
            const body = rows[0].parentElement.closest('.ant-modal-body') || rows[0].parentElement;
            const sw = body.querySelector('.ant-switch');
            if (!sw) return false;
            if ((body.textContent || '').indexOf('自动刷新') < 0) return false;
            return sw.classList.contains('ant-switch-checked');
          })(),
          // 日志更新后自动滚到底部（v26.10.07-v4）。
          // ⚠️ 先要求「真的可滚动」：若内容没超出高度，scrollTop 恒为 0，这条断言会永远为真（假绿）
          logAutoScrollBottom: (() => {
            const rows = Array.from(document.querySelectorAll('.znhd-log-row'));
            if (!rows.length) return false;
            const scroller = rows[0].parentElement;
            if (scroller.scrollHeight <= scroller.clientHeight + 2) return false;
            return scroller.scrollHeight - scroller.clientHeight - scroller.scrollTop <= 4;
          })(),
          // 暗色终端风（v26.10.07-v1）断言：日志区底色、行三栏结构、底部状态栏都在
          logDarkTerminalOk: (() => {
            const rows = Array.from(document.querySelectorAll('.znhd-log-row'));
            if (!rows.length) return false;
            const scroller = rows[0].parentElement;
            const bg = getComputedStyle(scroller).backgroundColor;
            const ts = rows[0].querySelector('.znhd-log-ts');
            const tag = rows[0].querySelector('.znhd-log-tag');
            const msg = rows[0].querySelector('.znhd-log-msg');
            if (!ts || !tag || !msg) return false;
            // ⚠️ 必须从日志行**就近向上**找它所在的弹窗 body：报告时刻同时开着多个弹窗，
            //    用 document.querySelector('.ant-modal-body') 会取到别的弹窗（v26.10.07-v1 踩过）。
            const logBody = scroller.closest('.ant-modal-body') || scroller;
            const bodyText = logBody.textContent || '';
            return (
              bg === 'rgb(15, 20, 26)' && // #0f141a
              bodyText.indexOf('最新') >= 0 &&
              bodyText.indexOf('显示') >= 0
            );
          })(),
          // 主色必须是 antd 官方蓝色系 blue-6（v26.10.06-v22）：先查 token，再查一个真实渲染的主色控件，两道一起锁。
          // ⚠️ token 必须从**面板内的 antd 元素**上读，不能从面板宿主读：`--ant-color-primary` 由 antd 的 css-var
          //    包裹元素定义并向下继承，宿主元素本身没有它（v22 踩过，白红了一次）。
          // v26.10.07-v3：原先从「设置」实心按钮上读；该按钮按用户要求已去掉主色，故改从**语音播报 Switch** 读
          //    （Switch 选中态本身就是主色，仍在同一 css-var 继承链下，原始意图不变）。
          primaryTokenBlue: (() => {
            const s = document.querySelector('#__znhd_panel_host__ .ant-switch');
            if (!s) return false;
            return getComputedStyle(s).getPropertyValue('--ant-color-primary').trim().toLowerCase() === '#1677ff';
          })(),
          // v26.10.07-v3：按用户要求「设置」不再单独用主色，四个入口按钮样式必须完全一致（且都不是主色实心）。
          // 面板按钮现在是「图标 span + 文案 span」两段结构，故统一用 textContent **包含**匹配定位。
          panelBtnsUniform: (() => {
            const host = document.getElementById('__znhd_panel_host__');
            if (!host) return false;
            const labels = ['设置', '常用语', '历史文件', '设备互联'];
            const btns = Array.from(host.querySelectorAll('button')).filter((b) =>
              labels.some((t) => (b.textContent || '').indexOf(t) >= 0)
            );
            if (btns.length !== 4) return false;
            const bg = btns.map((b) => getComputedStyle(b).backgroundColor);
            return bg.every((c) => c === bg[0]) && bg[0] !== 'rgb(22, 119, 255)';
          })(),
          // 四个入口必须排在同一行（同一 offsetTop）——「合并到一行」这条需求的直接断言
          panelBtnsOneRow: (() => {
            const host = document.getElementById('__znhd_panel_host__');
            if (!host) return false;
            const labels = ['设置', '常用语', '历史文件', '设备互联'];
            const btns = Array.from(host.querySelectorAll('button')).filter((b) =>
              labels.some((t) => (b.textContent || '').indexOf(t) >= 0)
            );
            if (btns.length !== 4) return false;
            return new Set(btns.map((b) => Math.round(b.getBoundingClientRect().top))).size === 1;
          })(),
          // 二维码必须无圆角（v26.10.06-v21 按用户要求；圆角会切掉定位角标影响识别）
          qrNoRadius: (() => {
            const q = document.querySelector('img[alt="上传链接二维码"]');
            return !!q && getComputedStyle(q).borderRadius === '0px';
          })(),
          // 监控时间段是 4 个原生 <input type="time">（v26.10.06-v16 换掉 antd TimePicker：
          // 去掉 rc-picker + dayjs，产物实测 -325KB），值必须是 HH:mm
          timeInputsOk: (() => {
            const els = Array.from(document.querySelectorAll('.ant-modal input[type="time"]'));
            if (els.length !== 4) return false;
            return els.every((el) => /^\d{2}:\d{2}$/.test(el.value));
          })(),
          // 常用语必须是 antd **Drawer**（侧边栏），不是 Modal：v26.10.06-v14 按需求改的。
          // ⚠️ 断言用 `.ant-drawer-body`（v5/v6 都有）；**不要用 `.ant-drawer-content`** ——
          //    v6 已把它改名为 `.ant-drawer-section`，用旧名会假失败（本条踩过）。
          phrasesIsDrawer: !!document.querySelector('.ant-drawer.ant-drawer-right .ant-drawer-body'),
          // 方案 B：antd 浮层（Modal/Drawer…）必须盖在面板之上
          // （面板宿主 999999 < zIndexPopupBase 1000000）
          overlayAbovePanel: (() => {
            const host = document.getElementById('__znhd_panel_host__');
            const modalWrap = document.querySelector('.ant-modal-wrap, .ant-drawer');
            if (!host || !modalWrap) return false;
            const z = (el) => parseInt(getComputedStyle(el).zIndex, 10) || 0;
            return z(modalWrap) > z(host);
          })(),
          panel: text.includes('征纳互动监控'),
          // 版本号只从「面板宿主」里取：弹窗（更新日志/日志/常用语…）都 portal 到 documentElement，
          // 里面有各自的版本号文本，读全页会串台（v26.10.6-v1 踩过）。
          // v26.10.06-v9 起面板不再是 Shadow DOM，改为按宿主 id 取。
          version: (() => {
            const host = document.getElementById('__znhd_panel_host__');
            return ((host && host.textContent) || '').match(/v\d+\.\d+\.\d+-v\d+/) ? ((host.textContent.match(/v\d+\.\d+\.\d+-v\d+/) || ['<无>'])[0]) : '<无>';
          })(),
          // 文本弹窗
          textPopup: text.includes('冒烟测试文本：收到一条文本消息'),
          // 九宫格画廊
          galleryText: text.includes('收到的图片'),
          // 常用语成功路径（YAML 解析出按钮）
          phrasesLoaded: text.includes('冒烟常用语A'),
          phrasesClicked: !!window.__clickedPhrases,
          // 更新日志：入口可点 → 弹窗出现 → 渲染 mock 正文 → 底部按钮 → 条数提示（12 条只渲染 10）
          settingsClicked: !!window.__clickedSettings,
          changelogClicked: !!window.__clickedChangelog,
          changelogPopup: !!popup && text.includes('冒烟更新日志标记行'),
          changelogMoreBtn: !!popup && text.includes('获取更多日志'),
          changelogLimitHint: !!popup && text.includes('共 12 条，已显示最新 10 条'),
          // 点缩略图放大：主图必须真的渲染出来（v26.10.8-v1 回归断言）
          viewerZoom: window.__viewerZoom || null,
          viewerZoomOk: !!(
            window.__viewerZoom &&
            window.__viewerZoom.container &&
            window.__viewerZoom.decoded &&
            window.__viewerZoom.visible
          ),
          // 图片复制：**只允许尝试写 image/png**。
          // 旧实现「先按原图类型（jpeg）写一次、失败再转 PNG 重试」会命中
          // ClipboardItem.supports('image/jpeg') === false，且那一次失败已按规范消耗掉用户手势，
          // 导致真正的 PNG 重试也必然失败 —— 本断言就是把这条不变量钉死。
          copyWriteTypes: window.__copyWriteTypes || [],
          copyOk: (() => {
            // __copyWriteTypes 的结构：每次 write → [每个 item 的 types 数组]
            // 例如 [[['image/png']]] 表示「一次 write，一个 item，该 item 只声明了 image/png」
            const recs = window.__copyWriteTypes || [];
            if (!recs.length) return false; // 一次都没发起写入 → 代码没走到写入路径
            let sawPng = false;
            let bad = null;
            recs.forEach((rec) =>
              (rec || []).forEach((types) =>
                (types || []).forEach((t) => {
                  if (t === 'image/png') sawPng = true;
                  else bad = t;
                })
              )
            );
            return sawPng && bad === null;
          })(),
          // 打印（v26.10.08-v1 引入 / v26.10.08-v2 挪进放大预览工具栏）：
          // ① 按钮必须长在 antd 预览工具栏的胶囊容器（.ant-image-preview-actions）**里面**且带图标；
          // ② 点了之后 react-to-print 真的建出 id=printWindow 的打印 iframe（= 内容节点被找到，整条链路接通）。
          printBtnOk: !!window.__printBtnSeen && !!window.__printBtnInActions,
          printIframeOk: !!window.__printIframeSeen,
          // 发送到手机：必须先压缩再发（v26.10.06-v6 回归断言）。判定要点：
          // 实际 POST 的字节是 JPEG、最长边 ≤1600（压缩上限）、且比原图小。
          phoneSendCheck: window.__phoneSendCheck || null,
          phoneSendCompressedOk: !!(
            window.__phoneSendCheck &&
            window.__phoneSendCheck.got &&
            window.__phoneSendCheck.jpegMagic &&
            Math.max(window.__phoneSendCheck.w || 0, window.__phoneSendCheck.h || 0) <= 1600 &&
            window.__phoneSendCheck.bytes < (window.__phoneSendCheck.originalBytes || Infinity)
          ),
          xhr: window.__gmXhrLog.slice(0, 6),
          // ===== 样式隔离断言（v26.10.06-v11）=====
          // 宿主页面把 html/body 设成 text-align:center、且要求 content-box，
          // 面板/弹窗必须仍保持左对齐、盒模型正确 —— 否则就是隔离层失效（用户实测反馈过）。
          modalTextAlignLeft: (() => {
            const body = document.querySelector('.ant-modal-body');
            return !!body && getComputedStyle(body).textAlign === 'left';
          })(),
          // 图标必须与所在控件垂直居中（±2px）——守卫「第三方样式给 svg 加负 margin 把图标顶出控件」。
          // v26.10.06-v16 起 antd TimePicker 换回原生 input，原时钟图标已不存在，故改为量同类对象：
          // 输入框「清空 ×」→ 弹窗关闭图标 → 侧边栏关闭图标，取第一个存在且有高度的。
          iconVerticallyCentered: (() => {
            const pairs = [
              ['.ant-input-affix-wrapper', '.ant-input-clear-icon'],
              ['.ant-modal-close', '.ant-modal-close-x svg'],
              ['.ant-drawer-close', '.ant-drawer-close svg'],
            ];
            for (const pair of pairs) {
              const box = document.querySelector(pair[0]);
              const icon = document.querySelector(pair[1]);
              if (!box || !icon) continue;
              const a = box.getBoundingClientRect();
              const b = icon.getBoundingClientRect();
              if (!b.height) continue;
              return Math.abs(a.top + a.height / 2 - (b.top + b.height / 2)) <= 2;
            }
            return false;
          })(),
          relevantErrors: relevant,
        };
        document.getElementById('smoke-result').textContent = JSON.stringify(report, null, 2);
        document.title =
          'znhd-smoke:' +
          (report.panel &&
          report.textPopup &&
          report.galleryText &&
          report.phrasesLoaded &&
          report.changelogPopup &&
          report.viewerZoomOk &&
          report.copyOk &&
          report.printBtnOk &&
          report.printIframeOk &&
          report.phoneSendCompressedOk
            ? 'ALL-OK'
            : 'PARTIAL');
      }, 11000);
    </script>
  </body>
</html>
