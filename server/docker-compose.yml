version: '3.8'

services:
  p2p-transfer-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: p2p-transfer-server
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    networks:
      - p2p-network

networks:
  p2p-network:
    driver: bridge
