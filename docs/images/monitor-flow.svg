<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-label="监控与语音播报的判定顺序">
  <rect width="760" height="300" fill="#ffffff"/>
  <text x="20" y="20" font-size="12" font-family="'Noto Sans SC','Microsoft YaHei',system-ui,sans-serif" fill="#6e7781">每 3 秒跑一轮，下面两条线互不影响</text>

  <text x="24" y="52" font-size="12.5" font-weight="600" font-family="'Noto Sans SC','Microsoft YaHei',system-ui,sans-serif" fill="#185FA5">A · 等待人数</text>

  <g font-family="'Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <rect x="24" y="62" width="160" height="64" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="104" y="90" font-size="12.5" text-anchor="middle" fill="#1f2328">每 3 秒执行一次</text>
    <text x="104" y="108" font-size="11.5" text-anchor="middle" fill="#6e7781">页面只要不关就一直跑</text>

    <rect x="206" y="62" width="160" height="64" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="286" y="88" font-size="12.5" text-anchor="middle" fill="#1f2328">当前在监控时段内？</text>
    <text x="286" y="106" font-size="11.5" text-anchor="middle" fill="#b54708">否 ⇒ 本轮跳过，不读页面</text>

    <rect x="388" y="62" width="160" height="64" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="468" y="88" font-size="12.5" text-anchor="middle" fill="#1f2328">读页面上的等待人数</text>
    <text x="468" y="106" font-size="11.5" text-anchor="middle" fill="#6e7781">数字没变就什么都不做</text>

    <rect x="570" y="62" width="160" height="64" rx="8" fill="#eaf5ee" stroke="#2da44e"/>
    <text x="650" y="86" font-size="12.5" text-anchor="middle" fill="#1f2328">人数 &gt; 0 且与上次不同</text>
    <text x="650" y="104" font-size="11.5" text-anchor="middle" fill="#2da44e">语音「征纳互动有人来了」</text>
    <text x="650" y="119" font-size="11" text-anchor="middle" fill="#6e7781">一次变化只响一次</text>
  </g>

  <g stroke="#8b949e" stroke-width="1.4" fill="none">
    <path d="M186 94 l16 0 M198 90 l4 4 -4 4"/>
    <path d="M368 94 l16 0 M380 90 l4 4 -4 4"/>
    <path d="M550 94 l16 0 M562 90 l4 4 -4 4"/>
  </g>

  <text x="24" y="152" font-size="12.5" font-weight="600" font-family="'Noto Sans SC','Microsoft YaHei',system-ui,sans-serif" fill="#185FA5">B · 掉线检测</text>

  <g font-family="'Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <rect x="24" y="162" width="200" height="62" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="124" y="187" font-size="12.5" text-anchor="middle" fill="#1f2328">页面出现含「掉线」的弹窗</text>
    <text x="124" y="205" font-size="11.5" text-anchor="middle" fill="#6e7781">每轮重新查，不缓存节点</text>

    <rect x="246" y="162" width="250" height="62" rx="8" fill="#fdecec" stroke="#e5484d"/>
    <text x="371" y="187" font-size="12.5" text-anchor="middle" fill="#1f2328">首次发现 ⇒ 语音「已掉线」</text>
    <text x="371" y="205" font-size="11.5" text-anchor="middle" fill="#c13538">弹窗消失后复位，再掉线还会响</text>
  </g>
  <g stroke="#8b949e" stroke-width="1.4" fill="none">
    <path d="M226 193 l16 0 M238 189 l4 4 -4 4"/>
  </g>

  <g font-size="11.5" font-family="'Noto Sans SC','Microsoft YaHei',system-ui,sans-serif" fill="#6e7781">
    <text x="516" y="187">弹窗一直挂着不会每 3 秒喊一次，</text>
    <text x="516" y="205">免得把后面真正的提醒挤出语音队列。</text>
  </g>

  <line x1="20" y1="240" x2="740" y2="240" stroke="#e4e7eb"/>
  <g font-size="12.5" font-family="'Noto Sans SC','Microsoft YaHei',system-ui,sans-serif" fill="#4b5563">
    <text x="24" y="262">· 监控时段默认 9:00–12:00、13:30–18:00，在「设置 → 其他设置 → 监控时间段」改，改完立即生效。</text>
    <text x="24" y="284">· 语音关着的时候不播报、也不排队攒着；重新打开后按当时的人数重新判断一次，不会漏。</text>
  </g>
</svg>
