<svg xmlns="http://www.w3.org/2000/svg" width="760" height="234" viewBox="0 0 760 234" role="img" aria-label="征纳互动标题栏上的脚本入口示意">
  <rect width="760" height="234" fill="#ffffff"/>
  <text x="20" y="18" font-size="12" font-family="'Noto Sans SC','Microsoft YaHei',system-ui,sans-serif" fill="#6e7781">站点标题栏，脚本注入的控件在【工作台】【业务管理】右侧</text>

  <!-- 标题栏 -->
  <rect x="20" y="40" width="720" height="60" rx="8" fill="#1a6fc4"/>
  <text x="42" y="76" font-size="15" font-family="'Noto Sans SC','Microsoft YaHei',system-ui,sans-serif" fill="#ffffff" opacity="0.78">工作台</text>
  <text x="114" y="76" font-size="15" font-family="'Noto Sans SC','Microsoft YaHei',system-ui,sans-serif" fill="#ffffff" opacity="0.78">业务管理</text>

  <line x1="200" y1="52" x2="200" y2="88" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
  <line x1="292" y1="52" x2="292" y2="88" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
  <line x1="458" y1="52" x2="458" y2="88" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>

  <!-- 语音图标 -->
  <polygon points="220,63 226,63 233,57 233,83 226,77 220,77" fill="#ffffff"/>
  <path d="M238 62 a9 9 0 0 1 0 16" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <!-- 自绘开关（开） -->
  <rect x="246" y="63" width="34" height="16" rx="8" fill="#ffffff" opacity="0.92"/>
  <circle cx="271" cy="71" r="6" fill="#185FA5"/>

  <!-- 4 个入口 -->
  <circle cx="316" cy="70" r="16" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.45"/>
  <circle cx="316" cy="70" r="6" fill="none" stroke="#ffffff" stroke-width="1.7"/>
  <g stroke="#ffffff" stroke-width="1.7" stroke-linecap="round">
    <line x1="316" y1="61" x2="316" y2="64"/>
    <line x1="316" y1="76" x2="316" y2="79"/>
    <line x1="307" y1="70" x2="310" y2="70"/>
    <line x1="322" y1="70" x2="325" y2="70"/>
  </g>

  <circle cx="356" cy="70" r="16" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.45"/>
  <g stroke="#ffffff" stroke-width="1.8" stroke-linecap="round">
    <line x1="348" y1="64" x2="364" y2="64"/>
    <line x1="348" y1="70" x2="364" y2="70"/>
    <line x1="348" y1="76" x2="358" y2="76"/>
  </g>

  <circle cx="396" cy="70" r="16" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.45"/>
  <g stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" fill="none">
    <line x1="389" y1="66" x2="402" y2="66"/>
    <path d="M399 63 l3 3 -3 3"/>
    <line x1="403" y1="75" x2="390" y2="75"/>
    <path d="M393 72 l-3 3 3 3"/>
  </g>

  <circle cx="436" cy="70" r="16" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.45"/>
  <g stroke="#ffffff" stroke-width="1.7" fill="none">
    <rect x="428" y="62" width="16" height="15" rx="2"/>
    <path d="M429 75 l5 -6 4 4 3 -2 2 4"/>
  </g>

  <!-- 版本徽标 -->
  <rect x="472" y="60" width="104" height="20" rx="4" fill="#ffffff" fill-opacity="0.15"/>
  <text x="524" y="74" font-size="11" font-family="'Noto Sans SC','Microsoft YaHei',system-ui,sans-serif" fill="#ffffff" text-anchor="middle">v26.10.27-v3</text>

  <!-- 序号 -->
  <g font-size="10" font-family="'Noto Sans SC','Microsoft YaHei',system-ui,sans-serif" text-anchor="middle">
    <circle cx="262" cy="32" r="8" fill="#185FA5"/><text x="262" y="35.5" fill="#ffffff">1</text>
    <circle cx="316" cy="32" r="8" fill="#185FA5"/><text x="316" y="35.5" fill="#ffffff">2</text>
    <circle cx="356" cy="32" r="8" fill="#185FA5"/><text x="356" y="35.5" fill="#ffffff">3</text>
    <circle cx="396" cy="32" r="8" fill="#185FA5"/><text x="396" y="35.5" fill="#ffffff">4</text>
    <circle cx="436" cy="32" r="8" fill="#185FA5"/><text x="436" y="35.5" fill="#ffffff">5</text>
    <circle cx="524" cy="32" r="8" fill="#185FA5"/><text x="524" y="35.5" fill="#ffffff">6</text>
  </g>

  <g font-size="13" font-family="'Noto Sans SC','Microsoft YaHei',system-ui,sans-serif" fill="#1f2328">
    <text x="24" y="130">① 语音播报开关　　② 设置　　③ 常用语　　④ 传输助手　　⑤ 图片嗅探　　⑥ 当前脚本版本</text>
  </g>
  <line x1="20" y1="148" x2="740" y2="148" stroke="#e4e7eb"/>

  <g font-size="12.5" font-family="'Noto Sans SC','Microsoft YaHei',system-ui,sans-serif" fill="#4b5563">
    <text x="24" y="172">· 点图标弹出对应窗口，窗口互不遮挡，按 Esc 或点「×」关闭；鼠标停在图标上会显示名称。</text>
    <text x="24" y="196">· 语音开关和窗口里的设置是同一份状态，在哪边改都一样。</text>
    <text x="24" y="220">· 看不到这一排控件 = 脚本没加载（脚本管理器图标上应有角标 1）。</text>
  </g>
</svg>
