<svg xmlns="http://www.w3.org/2000/svg" width="760" height="404" viewBox="0 0 760 404" role="img" aria-label="图片嗅探按会话分组示意">
  <rect width="760" height="404" fill="#ffffff"/>
  <text x="20" y="20" font-size="12" font-family="'Noto Sans SC','Microsoft YaHei',system-ui,sans-serif" fill="#6e7781">扫一遍当前页面上的图，在征纳互动里默认按「会话（纳税人）」分组</text>

  <rect x="24" y="34" width="712" height="286" rx="12" fill="#ffffff" stroke="#d0d7de"/>

  <text x="44" y="66" font-size="16" font-weight="600" font-family="'Noto Sans SC','Microsoft YaHei',system-ui,sans-serif" fill="#1f2328">图片嗅探</text>

  <!-- 阈值 -->
  <text x="470" y="63" font-size="11.5" font-family="'Noto Sans SC','Microsoft YaHei',system-ui,sans-serif" fill="#4b5563">小于</text>
  <rect x="496" y="48" width="46" height="22" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="519" y="63" font-size="12" text-anchor="middle" font-family="'Noto Sans SC','Microsoft YaHei',system-ui,sans-serif" fill="#1f2328">20</text>
  <text x="548" y="63" font-size="11.5" font-family="'Noto Sans SC','Microsoft YaHei',system-ui,sans-serif" fill="#4b5563">KB</text>
  <!-- 全选 -->
  <rect x="572" y="48" width="58" height="22" rx="6" fill="#f1f2f4" stroke="#d0d7de"/>
  <text x="601" y="63" font-size="11.5" text-anchor="middle" font-family="'Noto Sans SC','Microsoft YaHei',system-ui,sans-serif" fill="#1f2328">全选</text>
  <!-- 下载所选 -->
  <rect x="638" y="48" width="82" height="22" rx="6" fill="#185FA5"/>
  <text x="679" y="63" font-size="11.5" text-anchor="middle" font-family="'Noto Sans SC','Microsoft YaHei',system-ui,sans-serif" fill="#ffffff">下载所选(2)</text>

  <!-- 组 1 -->
  <rect x="44" y="92" width="12" height="12" rx="3" fill="#ffffff" stroke="#8b949e"/>
  <text x="64" y="103" font-size="12.5" font-weight="600" font-family="'Noto Sans SC','Microsoft YaHei',system-ui,sans-serif" fill="#1f2328">张三（3 张）</text>
  <text x="146" y="103" font-size="11" font-family="'Noto Sans SC','Microsoft YaHei',system-ui,sans-serif" fill="#185FA5">当前会话，置顶</text>

  <g>
    <rect x="44" y="114" width="100" height="72" rx="6" fill="#eef1f4" stroke="#d8dee4"/>
    <rect x="156" y="114" width="100" height="72" rx="6" fill="#eef1f4" stroke="#d8dee4"/>
    <rect x="268" y="114" width="100" height="72" rx="6" fill="#eef1f4" stroke="#d8dee4"/>
    <g stroke="#9aa4ae" stroke-width="1.6" fill="none">
      <path d="M56 176 l18 -22 13 14 8 -8 12 16"/>
      <path d="M168 176 l18 -22 13 14 8 -8 12 16"/>
      <path d="M280 176 l18 -22 13 14 8 -8 12 16"/>
    </g>
    <g fill="#6e7781" font-size="10.5" font-family="'Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
      <text x="44" y="198">268 KB · 10:24</text>
      <text x="156" y="198">1.2 MB · 10:26</text>
      <text x="268" y="198">96 KB · 10:31</text>
    </g>
  </g>

  <!-- 组 2 -->
  <rect x="44" y="216" width="12" height="12" rx="3" fill="#ffffff" stroke="#8b949e"/>
  <text x="64" y="227" font-size="12.5" font-weight="600" font-family="'Noto Sans SC','Microsoft YaHei',system-ui,sans-serif" fill="#b54708">未归属会话（2 张）</text>

  <g>
    <rect x="44" y="238" width="100" height="66" rx="6" fill="#eef1f4" stroke="#d8dee4"/>
    <rect x="156" y="238" width="100" height="66" rx="6" fill="#eef1f4" stroke="#d8dee4"/>
    <g stroke="#9aa4ae" stroke-width="1.6" fill="none">
      <path d="M56 294 l18 -22 13 14 8 -8 12 16"/>
      <path d="M168 294 l18 -22 13 14 8 -8 12 16"/>
    </g>
    <g fill="#6e7781" font-size="10.5" font-family="'Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
      <text x="46" y="316">image.png · 46 KB</text>
      <text x="158" y="316">photo.jpg · 720 KB</text>
    </g>
  </g>

  <!-- 序号 -->
  <g font-size="10" font-family="'Noto Sans SC','Microsoft YaHei',system-ui,sans-serif" text-anchor="middle">
    <circle cx="519" cy="40" r="8" fill="#185FA5"/><text x="519" y="43.5" fill="#ffffff">1</text>
    <circle cx="679" cy="40" r="8" fill="#185FA5"/><text x="679" y="43.5" fill="#ffffff">2</text>
    <circle cx="712" cy="99" r="8" fill="#185FA5"/><text x="712" y="102.5" fill="#ffffff">3</text>
    <circle cx="712" cy="223" r="8" fill="#185FA5"/><text x="712" y="226.5" fill="#ffffff">4</text>
  </g>

  <line x1="20" y1="336" x2="740" y2="336" stroke="#e4e7eb"/>
  <g font-size="12" font-family="'Noto Sans SC','Microsoft YaHei',system-ui,sans-serif" fill="#4b5563">
    <text x="24" y="356">① 阈值：小于它的图不显示、也不参与全选（默认 20 KB，改完记住）　② 全选 / 下载所选：只作用于达标的图</text>
    <text x="24" y="378">③ 组头＝会话名＋张数，组内按消息时间从新到旧　④ 认不出归属的进「未归属会话」，不会丢</text>
    <text x="24" y="400">单击缩略图放大：滚轮缩放、旋转、多图左右切换、A4 打印（横向图自动转 90°）。</text>
  </g>
</svg>
