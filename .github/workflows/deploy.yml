name: 同步到云服务器（1panel Docker）

# 触发条件
on:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  # ↓↓↓ 本仓库在服务器上的「完整 git 克隆根目录」
  #     关键：挂载源是 /opt/znhd-service/relay-server（= 容器 /app），
  #     所以请把整个仓库克隆到其父目录 /opt/znhd-service，
  #     这样它的子目录 relay-server/ 正好是挂载源，git pull 即更新 /app。
  #     即：服务器上 /opt/znhd-service 是 git 仓库根（含 relay-server/、znhd.user.js 等），
  #     而 /opt/znhd-service/relay-server 被 1panel 挂载为容器 /app（server.js 在其根）。
  DEPLOY_PATH: /opt/znhd-service
  # ↓↓↓ 容器名（已通过 docker inspect 确认为 znhd），无需改动
  CONTAINER_NAME: "znhd"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检查分支
        uses: actions/checkout@main
        with:
          ref: main

      # 核心：SSH 登录宿主机 → git pull 更新被容器挂载的代码 → 重启 1panel/node 容器
      # （relay-server 零依赖、无需 npm install / 构建；重启容器即重新 node server.js 加载新代码）
      - name: 同步代码并重启 1panel 容器
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}               # SSH 端口，默认 22；非 22 时配置该 Secret
          script: |
            set -e
            # 1) 同步代码（首次自动就地初始化 git 仓库，无需手动 SSH）
            cd "$DEPLOY_PATH" 2>/dev/null || { echo "❌ DEPLOY_PATH=$DEPLOY_PATH 不存在，请先在服务器创建该目录"; exit 1; }
            git config --global --add safe.directory "$(pwd)"

            # 防御：清理挂载源子目录内的「嵌套 .git」（如 relay-server/.git）。
            # 否则父仓库会把 relay-server/ 当成孤立目录，checkout/reset 永远碰不到它，
            # 表现为「日志同步成功、但 /app 文件不更新、/health 仍是旧版本」。
            for d in $(find . -name .git -type d -mindepth 2 2>/dev/null); do
              echo "⚠️ 发现嵌套 git 目录: $d，已移除（由 $DEPLOY_PATH 根仓库统一管理）"
              rm -rf "$d"
            done

            # 首次部署：若目录不是 git 仓库（或没有 origin 远端），则就地初始化并绑定
            # （该目录已存在、内含正在运行的 relay-server 挂载源，故用 init 而非 clone，不破坏现有文件）
            if [ ! -d .git ]; then
              echo "ℹ️ 首次部署：$DEPLOY_PATH 不是 git 仓库，自动就地初始化..."
              git init -q
              git remote add origin "git@github.com:Run-os/znhd-service.git"
            elif ! git remote get-url origin >/dev/null 2>&1; then
              echo "ℹ️ 未发现 origin 远端，重新绑定..."
              git remote add origin "git@github.com:Run-os/znhd-service.git"
            fi

            # 强制同步工作树到 origin/main（reset --hard + clean 保证与远端完全一致，即更新被挂载的 /app）
            git fetch origin
            git checkout -f -B main origin/main
            git reset --hard origin/main
            git clean -fd
            echo "✅ 代码已同步到提交: $(git rev-parse --short HEAD) / 工作树版本: $(grep '"version"' relay-server/package.json | head -1 | tr -d ' ,')"

            # 2) 找到运行 relay 的 1panel/node 容器
            if [ -n "$CONTAINER_NAME" ]; then
              CID="$CONTAINER_NAME"
            else
              CID=$(docker ps --filter "ancestor=1panel/node:25.9.0" --format "{{.Names}}" | head -n1)
            fi
            if [ -z "$CID" ]; then
              echo "❌ 未找到 1panel/node 容器，请在 workflow 的 CONTAINER_NAME 里手动指定容器名"
              exit 1
            fi
            # 2) 强制把最新代码写入容器 /app（绕过 bind 失联）
            #     关键背景：1panel 的 /app 是 bind 挂载（本机 /opt/znhd-service/relay-server => /app）。
            #     git 的 reset/clean 在更新 relay-server 时会替换该目录的 inode，
            #     导致 Docker 的 bind 挂载 /app 仍指向「旧孤儿目录」（里面是旧版本 v6），
            #     而 docker stop/start/restart 都不会重新解析 bind，容器持续读旧代码。
            #     故不再依赖挂载自动同步，也避开 docker cp 的路径解析坑，
            #     改用 tar 管道把工作树最新代码直接写进容器当前看到的 /app（无论 bind 是否失联都正确）。
            rm -rf /tmp/znhd-deploy && mkdir -p /tmp/znhd-deploy
            cp -a "$DEPLOY_PATH/relay-server/." /tmp/znhd-deploy/ 2>/dev/null || cp -r "$DEPLOY_PATH/relay-server/." /tmp/znhd-deploy/
            rm -rf /tmp/znhd-deploy/node_modules /tmp/znhd-deploy/.git   # 排除无关/体积项
            echo "📦 将最新代码强制写入容器 /app（tar 管道，绕过 bind 失联）..."
            ( cd /tmp/znhd-deploy && tar cf - . ) | docker exec -i "$CID" tar xf - -C /app
            echo "✅ 代码已写入容器 /app"

            echo "🔄 重启容器以加载新代码: $CID"
            docker restart "$CID"
            sleep 4

            # 3) 健康检查 + 版本自证（避免「日志成功但代码没更新」的静默失败）
            EXPECT_VER="$(grep '"version"' relay-server/package.json 2>/dev/null | head -1 | tr -d ' ,"' | sed 's/version://')"
            if curl -fsS "http://127.0.0.1:5689/health" >/dev/null 2>&1; then
              HL="$(curl -fsS http://127.0.0.1:5689/health)"
              echo "✅ 健康检查通过: $HL"
            else
              echo "⚠️ 健康检查未通过（服务可能仍在启动，或 5689 未映射到宿主机），请登录服务器 docker logs $CID 排查"
            fi
            # 直接读容器内 /app 的版本，与工作树期望版本比对
            CT_VER="$(docker exec "$CID" grep -m1 '"version"' /app/package.json 2>/dev/null | tr -d ' ,"' | sed 's/version://')"
            if [ -n "$CT_VER" ]; then
              if [ "$CT_VER" = "$EXPECT_VER" ]; then
                echo "✅ 容器内版本($CT_VER) 与代码库一致，部署生效"
              else
                echo "❌ 版本不一致：容器内=$CT_VER  期望=$EXPECT_VER —— 说明 git 已更新磁盘(v2)但容器未加载。"
                echo "   请登录服务器执行： docker exec $CID sh -c 'ls -la /app | head'   和   docker inspect -f '{{ json .Mounts }}' $CID"
                exit 1
              fi
            else
              echo "⚠️ 无法读取容器内 /app/package.json 版本（容器可能未就绪）"
            fi
