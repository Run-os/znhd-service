个税常见问题: |
  【个税常见问题】
  @您与该单位不存在承包承租认定关系，不允许以“承包承租经营单位”办理，请确认。
  ⭕ 解决办法：你需要先点击单位办税，然后先进行人员信息采集，再预缴纳税申报，或者返回经营所得A表进行申报。

  @“纳税人符合个体工商户减半征收个人所得税优惠政策，但未享受该减免，建议纳税人修改”。
  ⭕ 解决办法：https://www.toutiao.com/article/7320877871139160613/?wid=1773304851051

  @如何更正或作废生产经营所得申报表？
  ⭕ 解决办法：http://qingdao.chinatax.gov.cn/ssfg2019/cjwt/grsds/202601/t20260130_102158.html

预缴外管证: |
  【所需资料】
  跨区域事项报告表（纳税人提供，电子税务局打印），增值税及附加税费预缴表（纳税人提供，也可以现场填写），企业营业执照复印件，法人及经办人身份证复印件，合同主要页面复印件，以上资料加盖公章。
  【注意】
  ⭕ 外管证预缴税费明细：增值税及附加，企业所得税，水利建设专项收入，工会经费
  ⭕ 如果不是第一次外管证，只需要增值税及附加税费预缴表，加盖公章。增值税及附加税费预缴表下载链接：https://12366.chinatax.gov.cn/bzds/002/002.html

  @如果仅预交工会经费和水利建设专项收入
  ⭕ 自行填写通用申报表数据，并加盖公章，然后发送过来即可。通用申报表下载链接：https://hainan.chinatax.gov.cn/bsfw_6_3_2/06101632.html
  ⭕ 注意：需在申报表中将征收项目和品目填写完整，标注外管证编号。

