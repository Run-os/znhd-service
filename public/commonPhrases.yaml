注销——未办理税务登记: |
  【未办理税务登记】
  ⭕ 打开 https://etax.hunan.chinatax.gov.cn:8443/xxbg/view/ztxxbg/qssbswzxblwkyqs ，自行打印清税证明
  ⭕ 如果上述方法无法正常打印，这边可以给您出具一个未涉税事项证明，需要您通过法人身份登录征纳互动，将如下资料发送过来：营业执照、法人身份证

注销——已办理税务登记: | 
  ❗注意：征纳互动不能办理所有的线下业务，仅能办理部分风险较低的业务，请您理解。
  【已办理税务登记】
  ⭕请先和您的税管员取得联系，税管员同意之后，再登录电子税务局电脑端搜索「清税申报（税务注销办理）」办理。详细操作流程：https://mp.weixin.qq.com/s/JqIEoAqo-BqWqSCrQYGuMQ
  ⭕建议先处理清税申报中的其他未完结事项，最后办理个税申报。

  @个税申报
  ⭕个税申报需先将纳税人状态调整为清算状态，再办理申报业务。纳税人状态可通过【纳税人信息查询】模块，在“纳税人基本信息”中查看。
  ⭕申报前请联系工作人员同步个税状态，同步完成3小时后可办理当季度个税申报，税款所属期截至注销当月。示例：纳税人5月办理注销，仅需申报1—5月个税，无需按完整申报期1-6月申报。
  ⭕如果提示无法申报本期数据，原因是当前不是清算状态，可以在电子税务局注销清税界面，多次预检刷新一下，系统会自动变为清算状态。
  ⭕若无法将纳税人状态调整为清算状态，该业务暂不支持线上办理，需前往办税服务厅线下办理，相关资料详见下方［线下办理资料］。

  @线下办理资料：
  ⭕需提供营业执照复印件、法定代表人身份证复印件。
  ⭕线下申报的申报表，须加盖经公安部门备案的公章；或由法定代表人本人到场并按手印确认。
  ⭕法定代表人无法到场办理的，可出具书面委托书委托他人代办。委托书须载明法定代表人及被委托人相关信息，并由法定代表人、被委托人共同按手印确认，同时携带法定代表人及被委托人身份证复印件。

重置个税密码: |
  ⭕ 重置个税密码需要通过企业或个体身份登陆电子税务局，方可发起征纳互动重置个税密码
  ⭕ 如果您本人为财务负责人或法人，可自行重置个税密码，无需通过征纳互动重置，详细操作流程：https://mp.weixin.qq.com/s/sDP6STCU8u-WCp-S1I6UBw

退税资料: |
  【纳税人提供资料】
  ⭕ 请线下提交退抵税资料后，再发起申请。退抵税资料如下：
    ⭕ 退抵税申请表（可到窗口线下领取）
    ⭕ 营业执照、开户许可复印件
    ⭕ 法人，经办人身份证复印件
    ⭕ 完税凭证原件
  【注意】以上资料全部加盖公章

  【补充】
  ⭕ 如果开具了发票，需要发票原件（纸票需要五联全部）
  ⭕ 如果您属于异名退税，还需要提供一份加盖公章的情况说明。
  ⭕ 如果涉及更正申报表，需要提供更改前后的申报表，加盖公章

申报记录查询: |
  【电子税务局】
  ⭕ 您可以进入【未申报查询】，查询未申报报表。
  ⭕ 您可以进入【申报信息查询】，查询已申报记录，找出未申报的属期。

  【自然人电子税务局——查个税】
  ⭕ 登录自然人电子税务局网页版（网址：https://etax.chinatax.gov.cn/），进入【申报查询】。
    ✅ “未完成”或者“已完成”里可以查询申报缴款记录，点击“查看详情”可以看到明细数据。

作废申请表: |
