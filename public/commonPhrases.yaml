解除非正常: |
  【解除非正常】
  ⭕ 先在10号窗口做处罚，然后前往6——8号窗口将未申报的报表补申报（申报表需要加盖备案过的公章，如果立马注销可以用法人按手印替代公章）。
  ⭕ 处罚需要公示三个工作日，三个工作日之后可到线下窗口缴纳罚款并解除非正常状态。
  ❗注意：由于补申报和解非需要收加盖公章的纸质资料，必须线下处理，暂不支持线上处理。

强制登记: |
  @强制登记
  ⭕ 您应该是存在营业执照，但是未做税务登记，经系统检测后强制做了税务登记。请在被登记后及时申报相关税费，避免罚款。
    ✅ 根据《中华人民共和国税收征收管理法》及相关法规规定，从事生产、经营的纳税人（包括企业、个体工商户等）自领取营业执照之日起30日内，应当持有关证件，向税务机关申报办理税务登记。税务机关应当于收到申报的当日办理登记并发给税务登记证件。
    ✅ 若未按时办理税务登记，税务机关可责令限期改正，并处以罚款。因此，建议在完成工商登记后，及时按照规定办理税务登记手续。

  @税费种时间与税务登记时间不同
  ⭕ 税务登记时间与税费种认定时间并无直接关联。税费种认定时间与工商登记时间相关联，只要税费种认定时间在工商登记时间之后，即属正常。
  ⭕ 若税费种认定时间早于税务登记时间，通常是因为纳税人在办理税务登记前，已通过互联网平台取得销售收入。根据平台上报的数据，系统自动完成了税务登记及税费种认定，因此出现税费种认定时间早于税务登记时间的情况，此属正常现象。
  ⭕ 上述情况下，纳税人需将税务登记前的历史收入，补申报至税费种认定后的首个申报属期内，以避免因逾期申报产生行政处罚。