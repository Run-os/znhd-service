未办理税务登记: |
  【未办理税务登记】
  ●打开 https://etax.hunan.chinatax.gov.cn:8443/xxbg/view/ztxxbg/qssbswzxblwkyqs ，自行打印清税证明
  ●如果上述方法无法正常打印，这边可以给您出具一个未涉税事项证明，需要您通过法人身份登录征纳互动，并将营业执照和法人身份证发送过来

已办理税务登记: | 
  【已办理税务登记】
  ●请先和您的税管员取得联系，税管员同意之后，再登录电子税务局电脑端搜索「清税申报（税务注销办理）」办理。详细操作流程：https://mp.weixin.qq.com/s/JqIEoAqo-BqWqSCrQYGuMQ
  ●建议先处理清税申报中的其他未完结事项，最后办理个税申报。申报前需联系工作人员同步个税状态，3小时后可申报当季度个税，截至月份为注销当月。例：5月注销，申报1-5月即可，无需按完整申报期申报。

重置个税密码: |
  ●重置个税密码需要通过企业或个体身份登陆电子税务局，方可发起征纳互动重置个税密码
  ●如果您本人为财务负责人或法人，可自行重置个税密码，无需通过征纳互动重置，详细操作流程：https://mp.weixin.qq.com/s/sDP6STCU8u-WCp-S1I6UBw

退税资料: |
  【纳税人提供资料】
  请线下提交退抵税资料后，再发起申请。退抵税资料如下：
  ●退抵税申请表（可到窗口线下领取）
  ●营业执照、开户许可复印件
  ●法人，经办人身份证复印件
  ●完税凭证原件
  【注意】以上资料全部加盖公章

  【补充】
  1. 如果开具了发票，需要发票原件（纸票需要五联全部）
  2. 如果您属于异名退税，还需要提供一份加盖公章的情况说明。
  3. 如果涉及更正申报表，需要提供更改前后的申报表，加盖公章

作废申请表: |
  ●所需资料：请填写申报表作废申请表，然后加盖公安备案过的公章。
  ●申请表下载：https://mp.weixin.qq.com/s/jROqtA-Wokg42vwS04vJ5g

系统维护中: |
  您好！近期系统正在维护中，稳定性受到影响，多个区县局均出现相同情况。我们已第一时间向上级反馈，并持续跟进。
  目前除耐心等待维护完成外，您可尝试多次刷新或错峰登录。

逾期未申报方法: |
  逾期未申报，提示上一属期未申报，解决方法：
  ●您可以进入【未申报查询】，查询未申报报表。
  ●如果未找到，您可以通过查询税费种时间（模块：【纳税人信息查询】-【税费种认定信息】），对比已申报记录（模块：【申报信息查询】），找出未申报的属期，通过【增值税及附加税（费）申报】，选择正确的所属期进行申报。
  ●如果以上方法均失败，请将 <税费种认定信息有效期> 和 <增值税申报失败界面> 截图发送一下，这边联系征管帮您刷新一下数据后，等待半小时，重新进入【增值税及附加税（费）申报】模块进行申报。
  ●刷新数据后如果依旧无法申报，则只能携带公章到线下窗口办理。

税务登记时间与税费种时间: |
  ●税务登记时间与税费种时间并无直接关联，税费种时间和工商登记时间关联，只要税费种时间在工商登记时间之后，都是没问题的
  ●如果税费种时间早于税务登记时间，大概率是在税务登记时间之前，存在互联网平台销售收入，根据平台上报数据，系统强制进行了税务登记，故税费种时间早于税务登记时间，这是正常的。这种情况需要您将历史收入，补申报在税费种认定后的第一个属期内，以免处罚。

个体日常申报: |
  请您查看下方教程，如教程看不懂，您可以前往政务服务中心的自助办税区，会有工作人员进行指导。
  【增值税】
  - 增值税申报（简单）：https://mp.weixin.qq.com/s/EbApG4ZcJ8GPOPHFza0htA； 
  - 增值税申报（详细说明）：https://mp.weixin.qq.com/s/Q_g_qQFDWlszihIii7gWSg；
  
  【其他税费】
  - 水利建设专项收入申报：https://mp.weixin.qq.com/s/QzfA3t72xXzEbV0XkunIsg
  
  【个税】
  - 个体户申报个税为按季申报，申报期为1.4.7.10月，1月需申报季报（A表）和年报（B表），如果存在多处经营，需要申报经营所得C表；其他申报期需申报季报（A表）。
  - 扣缴端和web端均可以申报个税，选择其一申报即可； 

  @个税web端操作
  - 个税申报（经营所得A、B、 C表-web端）操作流程：https://mp.weixin.qq.com/s/LHN9OyJ4q7HRCs0e6wEarQ；

  @个税扣缴端操作
  - 个体户按季、月申报个税（经营所得A表-扣缴端）详细操作流程：https://mp.weixin.qq.com/s/FWkxjFyLpjdUlYAl_YzLcw；
  - 申报年报（经营所得B表-扣缴端）https://mp.weixin.qq.com/s/YEKrZx16Hx1XVuG7g7K28A；
  - 个税扣缴端下载网址：https://hunan.chinatax.gov.cn/lists/20190719064543； 
  
  @常见问题
  - 提示：您与该单位不存在承包承租认定关系，不允许以“承包承租经营单位”办理，请确认。你需要先点击单位办税，然后先进行人员信息采集，再预缴纳税申报，或者返回经营所得A表进行申报。
申报记录查询: |
  【电子税务局】
  ●您可以进入【未申报查询】，查询未申报报表。
  ●您可以进入【申报信息查询】，查询已申报记录，找出未申报的属期。

  【自然人电子税务局--查个税】
  登录自然人电子税务局网页版（网址：https://etax.chinatax.gov.cn/），进入【申报查询】，“未完成”或者“已完成”里可以查询申报缴款记录，点击“查看详情”可以看到明细数据。
  

预缴外管证: |
  【所需资料】
  跨区域事项报告表（纳税人提供，电子税务局打印），增值税及附加税费预缴表（纳税人提供，也可以现场填写），企业营业执照复印件，法人及经办人身份证复印件，合同主要页面复印件，以上资料加盖公章。
  【注意】
  ●外管证预缴税费明细：增值税及附加，企业所得税，水利建设专项收入，工会经费
  ●如果不是第一次外管证，只需要增值税及附加税费预缴表，加盖公章。增值税及附加税费预缴表下载链接：https://12366.chinatax.gov.cn/bzds/002/002.html
  ●如果仅预交工会经费和水利建设专项收入，则只需要自行填写通用申报表数据，并加盖公章，然后发送过来即可。通用申报表下载链接：https://hainan.chinatax.gov.cn/bsfw_6_3_2/06101632.html

社保基数下调资料: |
  【2026年度官方通知及附件下载】
  ●链接：https://mp.weixin.qq.com/s/WXY69US9eU_m6fIObdpVkA

  【下调基数所需资料】
  1. 《湖南省用人单位社会保险费缴费工资申报承诺书》（附件1）、《湖南省用人单位社会保险费缴费工资调整申请表》（附件4）
  2. 加盖印章的需调整缴费工资的在岗职工上年度工资表和新职工起薪当月工资表。
  3. 需调整缴费工资的在岗职工上年度工资和新职工起薪当月工资发放流水的银行相关凭证或其他证明资料。
  
  【注意】
  1. 如果是机关事业单位，还需要提供《机关单位（含参公）缴费工资申报明细表》（附件2）
  2. 所有资料全部加盖公章。
  3. 《湖南省用人单位社会保险费缴费工资申报承诺书》、《湖南省用人单位社会保险费缴费工资调整申请表》、《机关单位（含参公）缴费工资申报明细表》需要管理部门签字

解除非正常: |
  【解除非正常】
  1. 先在10号窗口做处罚，然后前往6-8号窗口将未申报的报表补申报（申报表需要加盖备案过的公章，如果立马注销可以用法人按手印替代公章）。
  2. 处罚需要公示三个工作日，三个工作日之后可到线下窗口缴纳罚款并解除非正常状态。
  注意：由于补申报和解非需要收加盖公章的纸质资料，必须线下处理，暂不支持线上处理。