# CNB 流水线（2026-10-27 自 GitHub Actions 迁入，原 .github/workflows/webpack.yml + deploy.yml）
# 语法：分支(main) → 事件(push) → 流水线(docker.image) → stages → script
#   官方语法：https://docs.cnb.cool/zh/build/grammar.html
#   环境变量/密钥：https://docs.cnb.cool/zh/build/env.html
#   密钥仓库：https://docs.cnb.cool/zh/repo/secret.html
#
# 📁 各阶段的实际逻辑都在 ci/ 目录的脚本文件里（本文件只留阶段编排与环境声明），
#    改行为请改对应文件，别把长脚本塞回这里；stage 与文件的对应：
#      构建门禁.端到端冒烟        → ci/smoke.sh            （sh 执行，POSIX）
#      构建门禁.手机上传页门禁    → ci/web-gate.sh
#      部署.SSH 同步并重启容器    → ci/deploy.sh           （含远端 bash heredoc）
#      部署.通知 ScriptCat        → ci/notify-scriptcat.sh → ci/sc-webhook.js（node）
#    ⚠️ script 由 sh(dash) 执行 ⇒ 脚本内禁 `set -o pipefail`（远端 bash -s 不受限）；
#       用 `sh ci/xxx.sh` 引用而不用 `./xxx.sh`，省掉可执行位的维护。
#
# 两条流水线在同一个 push 上并行：
#   ① 构建门禁：装依赖 → 构建 → 类型检查 → 端到端冒烟 → 产物语法 → 手机页门禁/漂移检查
#   ② 部署：语法预检 → SSH 到 1panel 服务器 → git 同步（源头改为 CNB）→ tar 进容器 → 重启 → /health 版本自证 → 📡 通知 ScriptCat（webhook push）
#
# 🔐 部署凭据来自**密钥仓库**（不在本仓库、也不在网页环境变量里）：
#     https://cnb.cool/bbbbaa/keys/-/blob/main/env.prod.yml
#   由「部署」流水线的 imports 注入为环境变量 —— **只有部署流水线引用，门禁流水线完全不碰密钥**：
#     SERVER_HOST / SERVER_PORT / SERVER_USER / SSH_KEY_B64（私钥单行 base64）
#     SCRIPTCAT_WEBHOOK_SECRET（ScriptCat 用户设置 → Webhook 的 Secret，用于部署成功后
#       以 GitHub webhook 约定 POST push 事件，触发脚本商店即时同步；
#       URL 默认 https://scriptcat.org/api/v2/webhook/8492，可用 SCRIPTCAT_WEBHOOK_URL 覆盖）
#   · 密钥仓库禁止本地 clone、禁止 token 读取（`Secret repos do not support token access.`），
#     只能在流水线里 imports；在 Web 界面改文件即对所有引用方热生效，便于轮换。
#   · imports 的 URL 必须用 `/-/blob/<branch>/<file>`（注意不是 `/-/git/raw/`，后者是给脚本分发直链用的）。
#   · 变量名容忍别名：脚本按候选表取第一个非空值，找不到会打印「实际存在的相关变量名」而不是干瘪报错。
#   · 引用权限：默认仅密钥仓库的管理员/负责人**触发的**流水线可引用；若要放开给其他人触发，
#     需在 env.prod.yml 里声明 allow_slugs: [bbbbaa/znhd-service]（声明后改为纯规则校验，忽略角色）。

main:
  push: &pipelines
    # ============ ① 构建门禁（不部署，任何一步失败即红）============
    - name: 构建门禁
      docker:
        image: node:22
      env:
        # CI 镜像里不下载 puppeteer 自带的 Chromium（~150MB），改用系统 chromium（见冒烟阶段）
        PUPPETEER_SKIP_DOWNLOAD: 'true'
      stages:
        - name: 安装根依赖
          # npm ci 偶发 ECONNRESET（runner 侧网络抖动），重试一次；失败留下的半成品不影响第二次
          script: npm ci || npm ci

        - name: 构建脚本产物
          script: npm run build

        - name: 类型检查（strict）
          script: npm run typecheck

        - name: 端到端冒烟（无头 Chromium）
          script: sh ci/smoke.sh

        - name: 产物语法门禁
          script: node --check dist/znhd.user.js

        # ===== 手机上传页（Vue 3，独立子项目 web/；复用根 node_modules，故必须在上面的根 ci 之后）=====
        - name: 手机上传页门禁
          script: sh ci/web-gate.sh

    # ============ ② 部署到 1panel 服务器 ============
    - name: 部署到 1panel 服务器
      # 密钥仓库的 env.prod.yml 里的键值会被注入为本流水线的环境变量
      # （格式：顶层 key: value ⇒ 每个 key 一个环境变量；此处只引用，不复制值到仓库）
      imports:
        - https://cnb.cool/bbbbaa/keys/-/blob/main/env.prod.yml
      docker:
        image: node:22
      env:
        # 这三项与 GitHub 版 deploy.yml 的 env 完全一致，改服务器路径/容器名只改这里
        DEPLOY_PATH: /opt/znhd-service
        CONTAINER_NAME: znhd
        # 服务器端的代码源已从 GitHub 切到 CNB（公开仓库 ⇒ HTTPS 匿名 clone 即可）
        REPO_URL: https://cnb.cool/bbbbaa/znhd-service.git
      stages:
        - name: 语法预检 relay-server
          # 部署前先在流水线里校验，避免把坏文件推上线
          script: node --check relay-server/server.js

        - name: SSH 同步并重启容器
          script: sh ci/deploy.sh

        - name: 通知 ScriptCat 同步脚本（webhook · push）
          script: sh ci/notify-scriptcat.sh

  # 手动重跑：CNB 构建页的「重新构建」/ `cnb build start-build --repo .. --event api_trigger`
  # 复用上面两条流水线（YAML 锚点）；GitHub 时代靠 `gh run rerun --failed`，迁过来必须有等价入口。
  api_trigger: *pipelines

  pull_request:
    # PR 只跑门禁的前四步（快），不跑手机页构建与部署
    - name: PR 门禁
      docker:
        image: node:22
      stages:
        - name: 安装依赖
          script: npm ci || npm ci
        - name: 构建
          script: npm run build
        - name: 类型检查
          script: npm run typecheck
        - name: 产物语法门禁
          script: node --check dist/znhd.user.js
